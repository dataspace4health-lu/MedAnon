# ─────────────────────────────────────────────────────────────────────────────
# MedAnon  full stack
# Usage:
#   docker compose up              # start all services
#   docker compose up anonymizer   # start only the anonymizer
#   docker compose down -v         # tear down + remove volumes (wipes all DB data)
# ─────────────────────────────────────────────────────────────────────────────

# ── Networks ──────────────────────────────────────────────────────────────────
# processing-net: anonymizer, worker, gPAS, Redis, NLP, analytics, app-db, UI
# source-net:     source HAPI + its PostgreSQL (isolated; only anonymizer/worker bridge in)
# target-net:     target HAPI + its PostgreSQL (isolated; only anonymizer/worker/UI bridge in)
# Three-network segmentation: gPAS, Redis, NLP, analytics cannot reach the target FHIR
# directly. Only anonymizer/worker (write path) and UI (read proxy) bridge target-net.
networks:
  processing-net:
    driver: bridge
    # Stable network name (independent of compose project) so the Traefik
    # gateway labels can pin upstream lookups via traefik.docker.network.
    name: medanon-processing-net
  source-net:
    driver: bridge
  target-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────

volumes:
  gpas-db-data:
  gpas-db-replica-data:
  hapi-pg-data:
  hapi-target-pg-data:
  app-pg-data:
  sql-source-test-data:
  redis-data:
  minio-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  ui-certs:
  keycloak-pg-data:
  fhir-validator-cache:

# ── Shared environment (anonymizer + worker) ──────────────────────────────────
# Both services run the same image; this anchor eliminates the ~40-line duplication.
x-worker-env: &worker-env
  GPAS_URL: ${GPAS_URL}
  GPAS_DOMAIN: ${GPAS_DOMAIN}
  GPAS_OPERATION: ${GPAS_OPERATION}
  GPAS_TIMEOUT_SEC: ${GPAS_TIMEOUT_SEC}
  GPAS_TOKEN: ${GPAS_TOKEN:-}
  GPAS_BASIC_USER: ${GPAS_BASIC_USER:-}
  GPAS_BASIC_PASS: ${GPAS_BASIC_PASS:-}
  GPAS_CACHE_ENABLED: ${GPAS_CACHE_ENABLED:-true}
  GPAS_RETRY_COUNT: ${GPAS_RETRY_COUNT:-2}
  GPAS_RETRY_BACKOFF_SEC: ${GPAS_RETRY_BACKOFF_SEC:-0.2}
  GPAS_MAX_BATCH_SIZE: ${GPAS_MAX_BATCH_SIZE:-2000}
  GPAS_POOL_SIZE: ${GPAS_POOL_SIZE:-24}
  MEDANON_HASH_KEY: ${MEDANON_HASH_KEY:-}
  MEDANON_MANIFEST_ENABLED: ${MEDANON_MANIFEST_ENABLED:-true}
  MEDANON_SCORING_ENABLED: ${MEDANON_SCORING_ENABLED:-false}
  #
  MEDANON_SCORE_NER_ENABLED: ${MEDANON_SCORE_NER_ENABLED:-false}
  # MEDANON_REDIS_URL must be set explicitly in .env  no default password shipped here.
  MEDANON_REDIS_URL: ${MEDANON_REDIS_URL:?MEDANON_REDIS_URL must be set in .env}
  # Shared Redis client pool (utils/redis_pool.py). Bump for big-volume workloads 
  # Redis itself caps at `maxclients` (default 10000), so headroom is generous.
  MEDANON_REDIS_MAX_CONNECTIONS: ${MEDANON_REDIS_MAX_CONNECTIONS:-128}
  MEDANON_REDIS_SOCKET_TIMEOUT: ${MEDANON_REDIS_SOCKET_TIMEOUT:-5}
  MEDANON_REDIS_CONNECT_TIMEOUT: ${MEDANON_REDIS_CONNECT_TIMEOUT:-2}
  MEDANON_REDIS_HEALTHCHECK_SEC: ${MEDANON_REDIS_HEALTHCHECK_SEC:-30}
  MEDANON_JOB_WORKERS: ${MEDANON_JOB_WORKERS:-3}
  MEDANON_STAGING_DB_URL: ${MEDANON_STAGING_DB_URL:-}
  MEDANON_APP_DB_URL: ${MEDANON_APP_DB_URL:-postgresql://${MEDANON_APP_DB_USER:-medanon}:${MEDANON_APP_DB_PASSWORD:-medanon_dev}@app-db:5432/medanon}
  # SQL source de-identification (read-only ingest from external databases).
  # Empty allow-list denies all connections; Fernet key required to save/use them.
  MEDANON_SQL_SOURCE_ALLOWED_HOSTS: ${MEDANON_SQL_SOURCE_ALLOWED_HOSTS:-}
  MEDANON_SQL_CRED_KEY: ${MEDANON_SQL_CRED_KEY:-}
  MEDANON_STAGING_RETENTION_DAYS: ${MEDANON_STAGING_RETENTION_DAYS:-30}
  # Bigger staging batches => fewer Pass-1/gPAS/NLP cycles, larger gPAS dedup
  # window (better cache hit-rate), and fewer Postgres round-trips. 5000 is
  # safe for 8-CPU/3GB workers; drop to 2000 for 4-CPU/2GB.
  MEDANON_STAGING_BATCH_SIZE: ${MEDANON_STAGING_BATCH_SIZE:-5000}
  # Skip staged path for jobs below this row count; use fast stream executor.
  MEDANON_STAGED_THRESHOLD_ROWS: ${MEDANON_STAGED_THRESHOLD_ROWS:-500000}
  # Process-level parallelism for the staged worker bypasses the Python GIL.
  # Each process gets its own ``MEDANON_PARALLEL_WORKERS`` thread pool, so
  # total CPU usage = PROCESS_WORKERS * PARALLEL_WORKERS. Default 4 leaves
  # 2 CPUs of the 8-CPU worker free for I/O.
  MEDANON_STAGING_PROCESS_WORKERS: ${MEDANON_STAGING_PROCESS_WORKERS:-4}
  # Phase-2 executor: "thread" (default; overlaps I/O + partial-GIL FHIRPath) or
  # "process" (separate processes, bypasses the GIL plateau  ~2x faster on
  # warm-cache CPU-bound jobs). Process children rebuild their own store +
  # pseudonymizer and drain partitions via FOR UPDATE SKIP LOCKED.
  MEDANON_STAGING_EXECUTOR: ${MEDANON_STAGING_EXECUTOR:-thread}
  # With EXECUTOR=process, jobs below this partition count fall back to threads.
  MEDANON_STAGING_PROCESS_MIN_PARTITIONS: ${MEDANON_STAGING_PROCESS_MIN_PARTITIONS:-4}
  # Phase-2 re-fetch _id batch size (B2): larger = fewer round-trips per group.
  MEDANON_FHIR_REFETCH_CHUNK: ${MEDANON_FHIR_REFETCH_CHUNK:-200}
  # Claim heartbeat interval (s)  refresh Redis-Streams claims for running jobs.
  MEDANON_CLAIM_HEARTBEAT_SEC: ${MEDANON_CLAIM_HEARTBEAT_SEC:-30}
  # Rows per partition for shards mode. Smaller = better load balance.
  MEDANON_PARTITION_TARGET_ROWS: ${MEDANON_PARTITION_TARGET_ROWS:-10000}
  MEDANON_FHIR_FETCH_PARALLEL: ${MEDANON_FHIR_FETCH_PARALLEL:-4}
  MEDANON_COHORT_PARALLEL: ${MEDANON_COHORT_PARALLEL:-4}
  MEDANON_BATCH_SIZE: ${MEDANON_BATCH_SIZE:-1000}
  # With process workers, threads-per-process should stay modest to avoid
  # GIL contention. 4 is the sweet spot once PROCESS_WORKERS=4.
  MEDANON_PARALLEL_WORKERS: ${MEDANON_PARALLEL_WORKERS:-4}
  # Headroom for 4 processes × 32 threads + integration sub-pools.
  MEDANON_GLOBAL_MAX_THREADS: ${MEDANON_GLOBAL_MAX_THREADS:-128}
  # gPAS sub-batch executor.  ceil(MEDANON_BATCH_SIZE / GPAS_MAX_BATCH_SIZE) sub-batches
  # fire per chunk.  At default batch=1000 = gPAS max=1000: exactly 1 sub-batch → only
  # 1 worker ever used.  Set to 4 so a larger batch size doesn't need a config change.
  GPAS_SUBBATCH_PARALLEL: ${GPAS_SUBBATCH_PARALLEL:-4}
  # NLP client  parallel sub-batches when a single chunk exceeds NLP_MAX_BATCH_ITEMS.
  # At batch=1000 = NLP limit=1000: 1 sub-batch.  4 handles up to 4× batch size growth.
  NLP_CLIENT_SUBBATCH_PARALLEL: ${NLP_CLIENT_SUBBATCH_PARALLEL:-4}
  # Bigger anonymizer-side L1 cache => fewer NLP RPCs across batches.
  MEDANON_NLP_CACHE_MAX_ENTRIES: ${MEDANON_NLP_CACHE_MAX_ENTRIES:-500000}
  MEDANON_SEEN_VALUES_CAP: ${MEDANON_SEEN_VALUES_CAP:-1000000}
  MEDANON_PROGRESS_INTERVAL: ${MEDANON_PROGRESS_INTERVAL:-500}
  MEDANON_PIPELINE_ENABLED: ${MEDANON_PIPELINE_ENABLED:-true}
  MEDANON_PIPELINE_QUEUE_SIZE: ${MEDANON_PIPELINE_QUEUE_SIZE:-4}
  MEDANON_WORKERS: ${MEDANON_WORKERS:-4}
  MEDANON_REQUEST_TIMEOUT_SEC: ${MEDANON_REQUEST_TIMEOUT_SEC:-120}
  MEDANON_UPLOAD_BATCH_SIZE: ${MEDANON_UPLOAD_BATCH_SIZE:-500}
  MEDANON_UPLOAD_PARALLEL: ${MEDANON_UPLOAD_PARALLEL:-4}
  MEDANON_RESULT_STORAGE: ${MEDANON_RESULT_STORAGE:-local}
  MEDANON_RESULT_TTL_SEC: ${MEDANON_RESULT_TTL_SEC:-604800}
  MEDANON_RESULT_CLEANUP_INTERVAL_SEC: ${MEDANON_RESULT_CLEANUP_INTERVAL_SEC:-3600}
  FHIR_SOURCE_URL: ${FHIR_SOURCE_URL:-}
  FHIR_SOURCE_TOKEN: ${FHIR_SOURCE_TOKEN:-}
  FHIR_TARGET_URL: ${FHIR_TARGET_URL:-http://hapi-fhir-target:8080/fhir}
  FHIR_TARGET_TOKEN: ${FHIR_TARGET_TOKEN:-}
  FHIR_PAGE_SIZE: ${FHIR_PAGE_SIZE:-500}
  FHIR_POOL_SIZE: ${FHIR_POOL_SIZE:-10}
  MEDANON_TARGET_CONFIG_PROFILE: ${MEDANON_TARGET_CONFIG_PROFILE:-structural}
  # MINIO_ROOT_USER/PASSWORD must be set in .env when MEDANON_RESULT_STORAGE=s3.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-medanon-results}
  # Analytics microservice  always running on processing-net, no profile needed.
  # Proxied by /analyse/risk and /generate/synthetic endpoints.
  ANALYTICS_SERVICE_URL: http://analytics:8100
  # NLP microservice  always running, no profile needed.
  # Proxied by nlp_scrub / nlp_detect actions via RemoteNlpAdapter.
  NLP_SERVICE_URL: http://nlp-lb:8200
  # Scoring microservice  always running, no profile needed.
  # Proxied by pipeline.scoring.engine.score_resource via RemoteScoringClient.
  # Anonymizer falls back to local in-process scoring if the service is unreachable.
  SCORING_SERVICE_URL: ${SCORING_SERVICE_URL:-http://scoring:8300}
  # AI agent integration  disabled by default.
  # Set MEDANON_AI_ENABLED=true and configure the provider to enable AI features.
  MEDANON_AI_ENABLED: ${MEDANON_AI_ENABLED:-false}
  MEDANON_AI_PROVIDER: ${MEDANON_AI_PROVIDER:-ollama/llama3.1}
  MEDANON_AI_API_BASE: ${MEDANON_AI_API_BASE:-http://ollama:11434}
  MEDANON_AI_API_KEY: ${MEDANON_AI_API_KEY:-}
  # CPU inference is slow: a full config generation (~1k tokens) at ~15 tok/s on
  # gemma3:4b takes ~75s, so the code default of 60s cuts generation off. 180s
  # covers a full config with headroom; lower it when running against a GPU.
  MEDANON_AI_TIMEOUT_SEC: ${MEDANON_AI_TIMEOUT_SEC:-180}
  MEDANON_AI_PII_PROVIDER: ${MEDANON_AI_PII_PROVIDER:-}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-}
  # Output barrier. Not an AI setting despite its former position in this block:
  # the raw scan runs at the process_data_batch choke point and needs no model.
  # Default ON. It was `:-false` here, which silently overrode .env.example.
  MEDANON_PII_GATE: ${MEDANON_PII_GATE:-true}
  MEDANON_PII_GATE_BLOCK_SEVERITY: ${MEDANON_PII_GATE_BLOCK_SEVERITY:-critical,high}
  MEDANON_PII_GATE_NER_MODE: ${MEDANON_PII_GATE_NER_MODE:-warn}
  MEDANON_OUTPUT_GATE_ENABLED: ${MEDANON_OUTPUT_GATE_ENABLED:-true}
  MEDANON_GATE_IDENTIFIER_MODE: ${MEDANON_GATE_IDENTIFIER_MODE:-block}
  MEDANON_REGULATED_MODE: ${MEDANON_REGULATED_MODE:-false}
  MEDANON_RULE_SCHEMA_STRICT: ${MEDANON_RULE_SCHEMA_STRICT:-false}
  MEDANON_NLP_FAIL_MODE: ${MEDANON_NLP_FAIL_MODE:-redact}
  MEDANON_HASH_ALLOW_PLAIN: ${MEDANON_HASH_ALLOW_PLAIN:-false}
  MEDANON_REQUIRE_DURABLE_STORE: ${MEDANON_REQUIRE_DURABLE_STORE:-false}
  MEDANON_ALLOW_SQLITE_FALLBACK: ${MEDANON_ALLOW_SQLITE_FALLBACK:-false}
  # Trust Gate microservice  pre-privacy data-quality / trust assessment.
  # Opt-in: start the stack with `--profile trust` AND set
  # TRUST_GATE_SERVICE_URL=http://trust-gate:8400 to activate the intake
  # barrier. Empty (default) = the intake gate is a no-op. TRUST_GATE_MODE is
  # warn (advisory passport, never blocks) | block (refuse BLOCK datasets) | off.
  TRUST_GATE_SERVICE_URL: ${TRUST_GATE_SERVICE_URL:-}
  TRUST_GATE_MODE: ${TRUST_GATE_MODE:-warn}

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── 0. API Gateway (Traefik) ──────────────────────────────────────────────
  # Replaces the legacy nginx gpas-lb + nlp-lb containers with a single
  # service-mesh-aware gateway.  Routes are configured via Docker labels on
  # the gpas / nlp services (see their respective definitions below).
  #
  # Backward compatibility: the gateway joins processing-net under the legacy
  # network aliases ``gpas-lb`` and ``nlp-lb`` so existing GPAS_URL /
  # NLP_SERVICE_URL values (e.g. ``http://gpas-lb:80/...``) keep working
  # without any .env changes.
  gateway:
    image: traefik:v3.2
    container_name: medanon-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Two entrypoints mirror the legacy LB ports so existing client URLs
      # continue to resolve.
      - --entrypoints.gpas.address=:80
      - --entrypoints.nlp.address=:8200
      # Built-in observability surface.
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.metrics.address=:8082
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "${GPAS_PORT:-8080}:80"
      - "${NLP_PORT:-8200}:8200"
    volumes:
      # Read-only socket mount  Traefik discovers labels but cannot mutate.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      processing-net:
        aliases:
          - gpas-lb
          - nlp-lb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 96M
    security_opt:
      - no-new-privileges:true

  # FHIR de-identification / anonymiser ──────────────────────────────────
  anonymizer:
    build:
      context: services/anonymizer
      dockerfile: Dockerfile
      target: api
    image: ${ANONYMIZER_IMAGE:-medanon:latest}
    container_name: medanon
    restart: unless-stopped
    ports:
      - "${ANONYMIZER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      <<: *worker-env
      GPAS_ADMIN_URL: ${GPAS_ADMIN_URL:-}
      MEDANON_CORS_ORIGINS: ${MEDANON_CORS_ORIGINS}
      MEDANON_MAX_BODY_BYTES: ${MEDANON_MAX_BODY_BYTES}
      MEDANON_AUDIT_LOG_FILE: /output/audit.log
      MEDANON_WORKER_ENABLED: ${MEDANON_WORKER_ENABLED:-false}
      MEDANON_NLP_PREWARM: ${MEDANON_NLP_PREWARM:-false}
    volumes:
      - ./data:/data:ro
      - ./output:/output
    networks:
      - processing-net  # gPAS, Redis, NLP, analytics, app-db
      - source-net      # source HAPI (read-only fetch)
      - target-net      # target HAPI (write de-identified results)
    depends_on:
      gateway:
        condition: service_healthy
      analytics:
        condition: service_healthy
      scoring:
        condition: service_healthy
      gpas:
        condition: service_healthy
      nlp:
        condition: service_healthy
      fhir-server:
        condition: service_healthy
      fhir-target:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${ANONYMIZER_CPU_LIMIT:-4.0}"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M

  # Dedicated job worker (same image, no HTTP server) ────────────────
  # Handles async jobs (bulk-export, cohort, patient-export, bulk-import, reprocess)
  # independently from the web server. The anonymizer defaults to
  # MEDANON_WORKER_ENABLED=false so jobs are only executed here.
  worker:
    build:
      context: services/anonymizer
      dockerfile: Dockerfile
      target: worker
    image: ${WORKER_IMAGE:-medanon-worker:latest}
    # container_name intentionally absent  allows `--scale worker=N` and
    # prevents port-binding conflicts when running multiple replicas.
    # Scale via: make up  (reads WORKER_REPLICAS from .env, default 2)
    restart: unless-stopped
    # ENTRYPOINT is baked into the worker stage; no override needed.
    env_file:
      - .env
    environment:
      <<: *worker-env
      MEDANON_WORKER_METRICS_PORT: "9091"
      # Shards mode: each worker claims partitions independently via
      # FOR UPDATE SKIP LOCKED.  The last replica to finish calls _merge_shards.
      MEDANON_OUTPUT_MODE: ${MEDANON_OUTPUT_MODE:-shards}
      OTEL_SERVICE_NAME: medanon-worker
    expose:
      - "9091"
    volumes:
      - ./output:/output
    networks:
      - processing-net  # gPAS, Redis, NLP, analytics, app-db
      - source-net      # source HAPI (read-only fetch)
      - target-net      # target HAPI (write de-identified results)
    depends_on:
      gateway:
        condition: service_healthy
      nlp:
        condition: service_healthy
      gpas:
        condition: service_healthy
      fhir-target:
        condition: service_healthy
      analytics:
        condition: service_healthy
      scoring:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-8.0}"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9091/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 2. HAPI FHIR source server (source-net only) ───────────────────────────
  # Holds identified patient data. Only anonymizer/worker can reach it.
  # No processing-net service can initiate connections here.
  fhir-server:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir
    restart: unless-stopped
    # Source FHIR server holds identified patient data  intentionally NOT published
    # to a host port. Only anonymizer/worker on source-net can connect to it.
    # To inspect the source FHIR during development:
    #   docker compose exec fhir-server curl http://localhost:8080/fhir/metadata
    # Or override with: HAPI_EXPOSED_PORT=8081 in .env and add a ports section in
    # an override file (docker-compose.override.yml).
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_SERVER_ADDRESS:-http://localhost:8080/fhir}
      - HAPI_DB_USER=${HAPI_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_DB_NAME:-hapi}
      - JAVA_TOOL_OPTIONS=-Xms256M -Xmx1536M -XX:MetaspaceSize=128M -XX:MaxMetaspaceSize=256M -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./services/fhir-server/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - source-net
    depends_on:
      hapi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── 3. HAPI FHIR source PostgreSQL (source-net only) ──────────────────────
  hapi-db:
    image: postgres:16-alpine
    container_name: hapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_DB_NAME:-hapi}
    volumes:
      - hapi-pg-data:/var/lib/postgresql/data
    networks:
      - source-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_DB_USER:-hapi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # HAPI FHIR target server (target-net) ──────────────────────────────
  # Holds de-identified data. Isolated on target-net  only anonymizer, worker,
  # and UI can reach it. gPAS, Redis, NLP, and analytics have no path to it.
  fhir-target:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir-target
    restart: unless-stopped
    ports:
      - "${HAPI_TARGET_PORT:-8082}:8080"
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_TARGET_SERVER_ADDRESS:-http://localhost:8082/fhir}
      - HAPI_DB_USER=${HAPI_TARGET_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_TARGET_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_TARGET_DB_NAME:-hapi_target}
      - JAVA_TOOL_OPTIONS=-Xms256M -Xmx1536M -XX:MetaspaceSize=128M -XX:MaxMetaspaceSize=256M -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./services/fhir-target/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - target-net
    depends_on:
      hapi-target-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HAPI FHIR target PostgreSQL (target-net) ──────────────────────────
  hapi-target-db:
    image: postgres:16-alpine
    container_name: hapi-target-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_TARGET_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_TARGET_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_TARGET_DB_NAME:-hapi_target}
    volumes:
      - hapi-target-pg-data:/var/lib/postgresql/data
    networks:
      - target-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_TARGET_DB_USER:-hapi} -d ${HAPI_TARGET_DB_NAME:-hapi_target}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # ── 4. gPAS PostgreSQL database (processing-net) ──────────────────────────
  gpas-db:
    image: postgres:16-alpine
    container_name: gpas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpas
      POSTGRES_USER: ${GPAS_DB_USER:-gpas_user}
      POSTGRES_PASSWORD: ${GPAS_DB_PASSWORD:-gpas_password}
      TZ: Europe/Berlin
    volumes:
      - ./services/gpas/sqls_pg:/docker-entrypoint-initdb.d
      - gpas-db-data:/var/lib/postgresql/data
    networks:
      - processing-net
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c max_connections=150
      -c timezone=Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GPAS_DB_USER:-gpas_user} -d gpas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ── 5. gPAS TTP pseudonymisation service (processing-net) ─────────────────
  # No container_name or static host-port binding here  both would block
  # `docker compose up --scale gpas=N`.  External access goes via the Traefik
  # gateway which exposes the legacy ``gpas-lb`` network alias on port 80.
  # Anonymizer/worker route through ``http://gpas-lb:80/...`` (re-resolved on
  # every request via Docker DNS, so scaling gpas adds replicas to the pool).
  gpas:
    image: mosaicgreifswald/wildfly:38
    restart: unless-stopped
    env_file:
      - ./services/gpas/envs/ttp_commons.env
      - ./services/gpas/envs/ttp_fhir.env
      - ./services/gpas/envs/ttp_gpas.env
      - ./services/gpas/envs/ttp_gras.env
      - ./services/gpas/envs/ttp_noti.env
      - ./services/gpas/envs/wf_commons.env
    environment:
      MOS_WAIT_FOR_PORTS: gpas-db:5432:120
      TZ: Europe/Berlin
      # Datasource MUST target the PostgreSQL backend (gpas-db). Without these
      # the WildFly CLI (configure_wildfly_*.cli) defaults the gPAS datasource to
      # mysql/host=mysql:3306 and the gras/noti datasources to host=postgresql,
      # all of which fail to resolve (UnknownHostException). gpasDS then can't
      # connect, the AnonymDomainBean/Cache EJBs never start, and every
      # $pseudonymize* call hangs until timeout.
      #
      # Global host/port  inherited by the gras (auth) and noti datasources,
      # which all share the single `gpas` database on gpas-db (gras/noti use
      # dedicated schemas; see services/gpas/sqls_pg/).
      TTP_DB_HOST: gpas-db
      TTP_DB_PORT: "5432"
      TTP_DB_USER: ${GPAS_DB_USER:-gpas_user}
      TTP_DB_PASS: ${GPAS_DB_PASSWORD:-gpas_password}
      # gPAS pseudonymization datasource  must be postgresql, not the mysql default.
      TTP_GPAS_DB_DBMS: postgresql
      TTP_GPAS_DB_HOST: gpas-db
      TTP_GPAS_DB_PORT: "5432"
      TTP_GPAS_DB_NAME: gpas
      TTP_GPAS_DB_USER: ${GPAS_DB_USER:-gpas_user}
      TTP_GPAS_DB_PASS: ${GPAS_DB_PASSWORD:-gpas_password}
    depends_on:
      gpas-db:
        condition: service_healthy
    volumes:
      - ./services/gpas/jboss:/entrypoint-wildfly-cli
      - ./services/gpas/jboss_pg/configure_00_postgresql_driver.cli:/entrypoint-wildfly-cli/configure_00_postgresql_driver.cli
      - ./services/gpas/jboss_pg/configure_wildfly_gras.cli:/entrypoint-wildfly-cli/configure_wildfly_gras.cli
      - ./services/gpas/jboss_pg/configure_wildfly_noti_service-2025.2.0.cli:/entrypoint-wildfly-cli/configure_wildfly_noti_service-2025.2.0.cli
      - ./services/gpas/deployments:/entrypoint-wildfly-deployments
      - ./services/gpas/addins:/entrypoint-wildfly-addins
    networks:
      - processing-net
    labels:
      # ── Traefik routing (replaces the legacy gpas-lb nginx container) ──
      - traefik.enable=true
      - traefik.docker.network=medanon-processing-net
      # FHIR API path  round-robin across all gpas replicas (default LB).
      - traefik.http.routers.gpas-fhir.entrypoints=gpas
      - traefik.http.routers.gpas-fhir.rule=PathPrefix(`/`)
      - traefik.http.routers.gpas-fhir.priority=1
      - traefik.http.routers.gpas-fhir.service=gpas-svc
      - traefik.http.services.gpas-svc.loadbalancer.server.port=8080
      # JSF web UI  sticky cookie keeps each session pinned to one replica
      # so WildFly's in-memory ViewState does not raise ViewExpiredException.
      - traefik.http.routers.gpas-web.entrypoints=gpas
      - traefik.http.routers.gpas-web.rule=PathPrefix(`/gpas-web`) || PathPrefix(`/gras-web`)
      - traefik.http.routers.gpas-web.priority=10
      - traefik.http.routers.gpas-web.service=gpas-web-svc
      - traefik.http.services.gpas-web-svc.loadbalancer.server.port=8080
      - traefik.http.services.gpas-web-svc.loadbalancer.sticky.cookie.name=gpas_session
      - traefik.http.services.gpas-web-svc.loadbalancer.sticky.cookie.httpOnly=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ttp-fhir/fhir/gpas/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 384M
    security_opt:
      - no-new-privileges:true

  # Analytics microservice (opt-in) ────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    image: medanon-analytics:latest
    container_name: medanon-analytics
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8100}:8100"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Scoring microservice ────────────────────────────────────────
  # Stateless composite privacy/utility/quality scoring.
  # Anonymizer/worker call this via SCORING_SERVICE_URL with local fallback.
  scoring:
    build:
      context: services/scoring
      dockerfile: Dockerfile
    image: medanon-scoring:latest
    container_name: medanon-scoring
    restart: unless-stopped
    expose:
      - "8300"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Trust Gate microservice (opt-in `trust` profile) ─────────────────────────
  # Pre-privacy data-quality / trust assessment → Quality Passport.
  # Activate with: docker compose --profile trust up  AND set
  # TRUST_GATE_SERVICE_URL=http://trust-gate:8400 in .env (see env anchor above).
  # Terminology validation is fail-soft: leave TRUST_GATE_TERMINOLOGY_URL empty
  # to skip it, or point it at an operator-provided server (e.g. Snowstorm 
  # requires Elasticsearch + a licensed SNOMED CT import; see docs/trust-gate.md).
  trust-gate:
    build:
      context: services/trust-gate
      dockerfile: Dockerfile
    image: medanon-trust-gate:latest
    container_name: medanon-trust-gate
    profiles: ["trust"]
    restart: unless-stopped
    # Expose port to other services on the network and publish to host
    expose:
      - "8400"
    ports:
      - "8400:8400"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Validator: the bundled sidecar is the HL7/Inferno fhir-validator-wrapper
      # (purpose-built Java validator, POST /validate?profile=, returns an
      # OperationOutcome envelope). To fall back to a HAPI $validate sidecar set
      # URL=http://fhir-validator:8080/fhir and ENDPOINT=/{type}/$validate.
      TRUST_GATE_VALIDATOR_URL: ${TRUST_GATE_VALIDATOR_URL:-http://fhir-validator:4567}
      TRUST_GATE_VALIDATOR_ENDPOINT: ${TRUST_GATE_VALIDATOR_ENDPOINT:-/validate}
      # Per-call + wrapper timeouts for the validator. The default 15s per-call
      # read timeout fired during a cold IG-package load and forced conformance
      # (Structural/Profile) to NA; 60s/90s absorb the cold start.
      TRUST_GATE_VALIDATOR_TIMEOUT_SEC: ${TRUST_GATE_VALIDATOR_TIMEOUT_SEC:-60}
      TRUST_GATE_VALIDATOR_ASYNC_TIMEOUT_SEC: ${TRUST_GATE_VALIDATOR_ASYNC_TIMEOUT_SEC:-90}
      TRUST_GATE_TERMINOLOGY_URL: ${TRUST_GATE_TERMINOLOGY_URL:-}
      # Decision-policy cut-offs (% checks passing)  OHDSI-DQD style, tunable.
      TRUST_GATE_PASS_MIN_RATE: ${TRUST_GATE_PASS_MIN_RATE:-90}
      TRUST_GATE_CATEGORY_MIN_RATE: ${TRUST_GATE_CATEGORY_MIN_RATE:-80}
      # Stateful QC platform: retain passports + findings + ALCOA++ audit trail so
      # the UI's history/trend/findings/audit views are populated. SQLite at a
      # writable path persists for the container's lifetime (single-instance). For
      # durable, cross-replica history set TRUST_GATE_STORE_DB_URL to a Postgres DSN.
      TRUST_GATE_STORE_DB: ${TRUST_GATE_STORE_DB:-/tmp/trust_gate.db}
      TRUST_GATE_STORE_DB_URL: ${TRUST_GATE_STORE_DB_URL:-}
      # Seed the statistical-advisory sampler so QC runs are reproducible.
      TRUST_GATE_SAMPLER_SEED: ${TRUST_GATE_SAMPLER_SEED:-1337}
      # uvicorn worker processes. The assess path is CPU-bound under concurrent
      # load (terminology results cached process-wide), so throughput scales with
      # workers up to the cpu limit. Keep TRUST_GATE_WORKERS == TRUST_GATE_CPUS.
      TRUST_GATE_WORKERS: ${TRUST_GATE_WORKERS:-2}
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # Match TRUST_GATE_WORKERS: the assess path is CPU-bound under load, so
          # 1.0 here throttled both workers onto a single core. Scale together.
          cpus: "${TRUST_GATE_CPUS:-2.0}"
          memory: ${TRUST_GATE_MEMORY:-512M}
        reservations:
          cpus: "0.2"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Trust Gate UI (opt-in `trust` profile) ───────────────────────────────────
  # Standalone single-page frontend for the Trust Gate service. Runs separately
  # from the main MedAnon SPA: paste FHIR → Quality Passport. nginx serves the
  # static page and proxies /v1/* + /health to trust-gate:8400.
  trust-gate-ui:
    build:
      context: services/trust-gate/ui
      dockerfile: Dockerfile
    image: medanon-trust-gate-ui:latest
    container_name: medanon-trust-gate-ui
    profiles: ["trust"]
    restart: unless-stopped
    ports:
      - "${TRUST_GATE_UI_PORT:-8401}:8401"
    depends_on:
      - trust-gate
    networks:
      - processing-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8401/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HL7 FHIR Validator sidecar (opt-in `trust` profile) ──────────────────────
  # The HL7/Inferno fhir-validator-wrapper: the purpose-built Java FHIR validator
  # (org.hl7.fhir.validation) behind an HTTP API (POST /validate?profile=, port
  # 4567, https://github.com/inferno-framework/fhir-validator-wrapper). It does
  # real base-spec + IG/profile structural validation and is far faster than a
  # HAPI $validate sidecar. Returns an OperationOutcome envelope. To fall back to
  # HAPI set image=hapiproject/hapi:latest + TRUST_GATE_VALIDATOR_URL/ENDPOINT.
  fhir-validator:
    image: infernocommunity/fhir-validator-service:latest
    container_name: medanon-fhir-validator
    profiles: ["trust"]
    restart: unless-stopped
    expose:
      - "4567"
    environment:
      # The validator loads FHIR definitions + IG packages into the heap; cap the
      # JVM to the container limit so it does not OOM-kill under the 3G ceiling.
      JAVA_OPTS: ${TRUST_GATE_VALIDATOR_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      # Terminology server wiring.
      # Tier 0 (default): DISABLE_TX=true → structural/profile validate OFFLINE
      # against loaded IG value sets  no tx.fhir.org round-trips, no cold-load
      # latency; conformance.terminology reports NA honestly.
      # Tier 1/2: stand up a self-hosted tx server, then in .env set
      # TRUST_GATE_VALIDATOR_DISABLE_TX=false and TRUST_GATE_VALIDATOR_TX_URL to it
      # (e.g. http://hapi-tx:8080/fhir).
      DISABLE_TX: ${TRUST_GATE_VALIDATOR_DISABLE_TX:-true}
      TX_SERVER_URL: ${TRUST_GATE_VALIDATOR_TX_URL:-}
    networks:
      - processing-net
    volumes:
      # Persist the FHIR package cache (~/.fhir) so IG packages auto-fetched on
      # first use survive restarts: the one-time cold download (tens of seconds)
      # is paid once, not on every container start.
      - fhir-validator-cache:/root/.fhir
    healthcheck:
      # /version returns the validator build once definitions have loaded (the
      # slow part of startup), so this doubles as a warm-up gate.
      test: ["CMD-SHELL", "curl -sf http://localhost:4567/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # The Java validator holds the full FHIR definition graph + loaded IG
          # packages in heap; 1.5G OOM-kills it mid-load. 3G is the safe floor.
          memory: 3072M

  # NLP microservice ────────────────────────────────────────
  # Scale with: docker compose up --scale nlp=2
  # External access goes through the Traefik gateway under the legacy
  # ``nlp-lb`` network alias on port 8200, so NLP_SERVICE_URL stays the same.
  nlp:
    build:
      context: services/nlp
      dockerfile: Dockerfile
    image: medanon-nlp:latest
    restart: unless-stopped
    expose:
      - "8200"
    environment:
      # ── L2 cache (Redis)  shared across replicas, survives restarts.
      # Uses DB 2 to stay isolated from anonymizer L2 (db 0) and job queue (db 1).
      NLP_REDIS_URL: ${NLP_REDIS_URL:-redis://:${MEDANON_REDIS_PASSWORD:-}@redis:6379/2}
      NLP_REDIS_TTL_SEC: ${NLP_REDIS_TTL_SEC:-604800}
      # Threads used by /v1/detect/batch when all items are detect-only and by
      # the new mixed-batch parallel detect path. spaCy releases the GIL for
      # most pipeline components, so 8 threads scale near-linearly on 4 CPUs.
      NLP_BATCH_THREADS: ${NLP_BATCH_THREADS:-8}
      # Larger batches => fewer HTTP round-trips between anonymizer and NLP.
      # Must stay <= the client's _NLP_CLIENT_BATCH_LIMIT default (also 2000).
      NLP_MAX_BATCH_ITEMS: ${NLP_MAX_BATCH_ITEMS:-2000}
    networks:
      - processing-net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      # ── Traefik routing (replaces the legacy nlp-lb nginx container) ──
      - traefik.enable=true
      - traefik.docker.network=medanon-processing-net
      - traefik.http.routers.nlp.entrypoints=nlp
      - traefik.http.routers.nlp.rule=PathPrefix(`/`)
      - traefik.http.services.nlp.loadbalancer.server.port=8200
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${NLP_CPU_LIMIT:-4.0}"
          memory: ${NLP_MEMORY_LIMIT:-3G}
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # gPAS PostgreSQL read replica  ──────────────────────────
  # Horizontal gPAS scaling : run `docker compose up --scale gpas=2`
  # to start multiple WildFly instances sharing gpas-db.  The gpas-lb service
  # load-balances all traffic (anonymizer/worker route through gpas-lb).
  # For PostgreSQL read replicas (analytics/backup), enable this profile ─ it
  # requires manual streaming-replication bootstrap or a PG operator.
  gpas-db-replica:
    image: postgres:16-alpine
    container_name: gpas-postgres-replica
    profiles: [ha]
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpas
      POSTGRES_USER: ${GPAS_DB_USER:-gpas_user}
      POSTGRES_PASSWORD: ${GPAS_DB_PASSWORD:-gpas_password}
      TZ: Europe/Berlin
    volumes:
      - gpas-db-replica-data:/var/lib/postgresql/data
    networks:
      - processing-net
    depends_on:
      gpas-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GPAS_DB_USER:-gpas_user} -d gpas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # React UI (processing-net + source-net + target-net) ──────────────
  # Needs source-net for /fhir/ proxy (Patient Browser).
  # Needs target-net for /fhir-target/ proxy (Target Browser).
  ui:
    build:
      context: client
      dockerfile: Dockerfile
    image: medanon-ui:latest
    container_name: medanon-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      # Hosts the self-signed TLS cert should be valid for. MUST include the
      # public IP/hostname users reach the UI on (space- or comma-separated),
      # e.g. TLS_SAN="10.168.192.22". Mount a real cert into /etc/nginx/certs
      # to override the self-signed one in production.
      TLS_SAN: ${TLS_SAN:-localhost 127.0.0.1}
    volumes:
      # Persist the self-signed cert so its fingerprint is stable across
      # restarts (users accept the browser warning only once). Drop a
      # CA-signed tls.crt/tls.key here to use a real cert instead.
      - ui-certs:/etc/nginx/certs
    networks:
      - processing-net
      - source-net
      - target-net
    depends_on:
      anonymizer:
        condition: service_healthy
    healthcheck:
      # Probes the internal plain-HTTP health port (8500), not the TLS port.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8500/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # App-state PostgreSQL (processing-net) ─────────────────────────────
  app-db:
    image: postgres:16-alpine
    container_name: medanon-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medanon
      POSTGRES_USER: ${MEDANON_APP_DB_USER:-medanon}
      POSTGRES_PASSWORD: ${MEDANON_APP_DB_PASSWORD:-medanon_dev}
    volumes:
      - app-pg-data:/var/lib/postgresql/data
      - ./services/anonymizer/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - processing-net
    command: >
      postgres
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDANON_APP_DB_USER:-medanon} -d medanon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # PostgreSQL's entrypoint needs CAP_CHOWN + CAP_SETUID to chown the data
    # directory and drop from root to the postgres user.  Dropping ALL caps
    # breaks every startup with "Operation not permitted".  Consistent with
    # hapi-db and gpas-db which also omit cap_drop.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  # ── Keycloak OIDC identity provider (processing-net) ──────────────────────
  # Opt-in: docker compose --profile auth up -d keycloak
  #
  # Reached ONLY through the UI's TLS nginx at https://<host>:8501/auth/  there
  # is intentionally NO published host port. Keycloak's own admin console is a
  # PKCE public client and therefore also needs an HTTPS secure context, so it
  # must be served via the same TLS edge (a plain-HTTP host port would hit the
  # exact "crypto.subtle requires HTTPS" error). One URL, no split-brain.
  #
  # Admin console: https://<host>:8501/auth/admin/   (master realm,
  #                KEYCLOAK_ADMIN_USER / KEYCLOAK_ADMIN_PASSWORD)
  keycloak-db:
    image: postgres:16-alpine
    container_name: medanon-keycloak-db
    profiles: ["auth"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set in .env}
    volumes:
      - keycloak-pg-data:/var/lib/postgresql/data
    networks:
      - processing-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: medanon-keycloak
    profiles: ["auth"]
    restart: unless-stopped
    # `start` (production mode). No --optimized: the stock image is not pre-built
    # for postgres, so Keycloak auto-augments on first boot. hostname-strict=false
    # lets it run behind the proxy without a baked hostname.
    command: ["start", "--import-realm"]
    environment:
      # ── Bootstrap admin (master realm) ──────────────────────────────────
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      # ── Database ────────────────────────────────────────────────────────
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # ── Reverse-proxy / hostname (served under /auth on the UI TLS edge) ──
      # TLS is terminated at nginx; Keycloak speaks plain HTTP internally and
      # trusts X-Forwarded-* so it builds correct https:// public URLs.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # Public browser-facing base URL INCLUDING /auth (KC 26 uses this path
      # verbatim for issued URLs; same path as KC_HTTP_RELATIVE_PATH, not
      # concatenated → no /auth/auth). Must be HTTPS and match OIDC_ISSUER's base.
      # e.g. KEYCLOAK_PUBLIC_URL=https://10.168.192.22:8501/auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-}
      # Lenient: when KC_HOSTNAME is empty, derive URLs from forwarded headers.
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./services/keycloak/realm-export.json:/opt/keycloak/data/import/medanon-realm.json:ro
      # Branded login/reset theme (the realm sets loginTheme: medanon).
      - ./services/keycloak/themes/medanon:/opt/keycloak/themes/medanon:ro
    networks:
      - processing-net
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The stock Keycloak image has no curl/wget; use bash /dev/tcp against the
      # master-realm discovery doc (path is known: /auth relative path)  200
      # once the server is fully up and the realm is served.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /auth/realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -qm1 '200' <&3"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Redis (processing-net) ────────────────────────────────────────────
  # Note: Redis logs "WARNING Memory overcommit must be enabled!" on Linux VMs.
  # This is a host kernel setting  fix with: sudo sysctl -w vm.overcommit_memory=1
  # (add to /etc/sysctl.conf for persistence). Not fixable inside the container.
  redis:
    image: redis:7-alpine
    container_name: medanon-redis
    restart: unless-stopped
    user: redis
    # AOF persistence is REQUIRED.  The gPAS pseudonym cache (and the NLP
    # detection cache) must survive Redis restarts  otherwise the second bulk
    # run is as slow as the first because every value is a fresh L2 miss.
    # `volatile-lru` only evicts keys with an explicit TTL, so the no-TTL
    # pseudonym entries are pinned for the lifetime of the dataset.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy volatile-lru
      --maxclients ${REDIS_MAXCLIENTS:-2000}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --requirepass ${MEDANON_REDIS_PASSWORD:?MEDANON_REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MEDANON_REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # MinIO object storage (opt-in: MEDANON_RESULT_STORAGE=s3) ──────────
  # SQL-source TEST database (opt-in) ───────────────────────────────
  # A throwaway PostgreSQL pre-seeded with SYNTHETIC PII across related
  # tables (patients / encounters / lab_results, linked by mrn) so you can
  # exercise the SQL source de-identification feature end-to-end.
  # Usage:  docker compose --profile sqltest up -d sql-source-test-db
  # Then add its hostname to the allow-list and connect from the UI:
  #   MEDANON_SQL_SOURCE_ALLOWED_HOSTS=app-db,sql-source-test-db
  #   host=sql-source-test-db port=5432 db=clinicdb user=clinic pass=clinic_dev
  sql-source-test-db:
    image: postgres:16-alpine
    container_name: medanon-sql-source-test
    profiles: [sqltest]
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicdb
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${SQL_TEST_DB_PASSWORD:-clinic_dev}
    volumes:
      - sql-source-test-data:/var/lib/postgresql/data
      - ./services/sql-source-test/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed for convenience (psql from the host); internal hostname is
      # sql-source-test-db on processing-net. Override the host port if 55432 is taken.
      - "${SQL_TEST_PORT:-55432}:5432"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinicdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 32M

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: medanon-minio
    profiles: [s3]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Ollama LLM (opt-in AI) ──────────────────────────────────────────
  # Local LLM server for AI agent features.  Only needed when running AI
  # co-located; otherwise point MEDANON_AI_API_BASE to a remote Ollama VM.
  # Usage: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    container_name: medanon-ollama
    profiles: [ai]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - processing-net
    environment:
      # CPU inference tuning  without these Ollama grabs every core and runs
      # multiple model copies, saturating the host. Cap threads to a sane
      # subset and serialise requests so the AI never starves the pipeline.
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      # Keep the model resident so we pay model-load cost once, not per request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Flash attention stabilises Gemma 3's sliding-window attention (SWA) on
      # multi-turn chats. Without it, the SWA context-checkpoint cache gets
      # invalidated on follow-up turns and the llama runner dies mid-stream with
      # "unexpected EOF" (a known Ollama/llama.cpp Gemma 3 bug). With FA on, the
      # KV cache uses a stable layout and the runner survives multi-turn.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-4.0}"
          memory: 8G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Monitoring stack (opt-in) ─────────────────────────────────────────────
  # Usage: docker compose --profile monitoring up
  # Prometheus scrapes all services; Grafana is proxied through the UI nginx
  # at /grafana/ so dashboards are accessible within the SPA; cAdvisor
  # exposes per-container CPU/memory metrics to Prometheus.

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: medanon-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - processing-net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:11.1.0
    container_name: medanon-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - processing-net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: medanon-cadvisor
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - processing-net
    ports:
      - "${CADVISOR_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: medanon-jaeger
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4318:4318"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
