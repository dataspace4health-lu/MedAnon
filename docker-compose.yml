# ─────────────────────────────────────────────────────────────────────────────
# MedAnon — full stack
# Usage:
#   docker compose up              # start all services
#   docker compose up anonymizer   # start only the anonymizer
#   docker compose down -v         # tear down + remove volumes (wipes all DB data)
# ─────────────────────────────────────────────────────────────────────────────

# ── Networks ──────────────────────────────────────────────────────────────────
# processing-net: anonymizer, worker, gPAS, Redis, NLP, analytics, app-db, UI
# source-net:     source HAPI + its PostgreSQL (isolated; only anonymizer/worker bridge in)
# target-net:     target HAPI + its PostgreSQL (isolated; only anonymizer/worker/UI bridge in)
# Three-network segmentation: gPAS, Redis, NLP, analytics cannot reach the target FHIR
# directly. Only anonymizer/worker (write path) and UI (read proxy) bridge target-net.
networks:
  processing-net:
    driver: bridge
    # Stable network name (independent of compose project) so the Traefik
    # gateway labels can pin upstream lookups via traefik.docker.network.
    name: medanon-processing-net
  source-net:
    driver: bridge
  target-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  gpas-db-data:
  gpas-db-replica-data:
  hapi-pg-data:
  hapi-target-pg-data:
  app-pg-data:
  redis-data:
  minio-data:
  ollama-data:
  prometheus-data:
  grafana-data:

# ── Shared environment (anonymizer + worker) ──────────────────────────────────
# Both services run the same image; this anchor eliminates the ~40-line duplication.
x-worker-env: &worker-env
  GPAS_URL: ${GPAS_URL}
  GPAS_DOMAIN: ${GPAS_DOMAIN}
  GPAS_OPERATION: ${GPAS_OPERATION}
  GPAS_TIMEOUT_SEC: ${GPAS_TIMEOUT_SEC}
  GPAS_TOKEN: ${GPAS_TOKEN:-}
  GPAS_BASIC_USER: ${GPAS_BASIC_USER:-}
  GPAS_BASIC_PASS: ${GPAS_BASIC_PASS:-}
  GPAS_CACHE_ENABLED: ${GPAS_CACHE_ENABLED:-true}
  GPAS_RETRY_COUNT: ${GPAS_RETRY_COUNT:-2}
  GPAS_RETRY_BACKOFF_SEC: ${GPAS_RETRY_BACKOFF_SEC:-0.2}
  GPAS_MAX_BATCH_SIZE: ${GPAS_MAX_BATCH_SIZE:-2000}
  GPAS_POOL_SIZE: ${GPAS_POOL_SIZE:-24}
  MEDANON_HASH_KEY: ${MEDANON_HASH_KEY:-}
  MEDANON_MANIFEST_ENABLED: ${MEDANON_MANIFEST_ENABLED:-true}
  MEDANON_SCORING_ENABLED: ${MEDANON_SCORING_ENABLED:-false}
  #
  MEDANON_SCORE_NER_ENABLED: ${MEDANON_SCORE_NER_ENABLED:-false}
  # MEDANON_REDIS_URL must be set explicitly in .env — no default password shipped here.
  MEDANON_REDIS_URL: ${MEDANON_REDIS_URL:?MEDANON_REDIS_URL must be set in .env}
  # Shared Redis client pool (utils/redis_pool.py). Bump for big-volume workloads —
  # Redis itself caps at `maxclients` (default 10000), so headroom is generous.
  MEDANON_REDIS_MAX_CONNECTIONS: ${MEDANON_REDIS_MAX_CONNECTIONS:-128}
  MEDANON_REDIS_SOCKET_TIMEOUT: ${MEDANON_REDIS_SOCKET_TIMEOUT:-5}
  MEDANON_REDIS_CONNECT_TIMEOUT: ${MEDANON_REDIS_CONNECT_TIMEOUT:-2}
  MEDANON_REDIS_HEALTHCHECK_SEC: ${MEDANON_REDIS_HEALTHCHECK_SEC:-30}
  MEDANON_JOB_WORKERS: ${MEDANON_JOB_WORKERS:-3}
  MEDANON_STAGING_DB_URL: ${MEDANON_STAGING_DB_URL:-}
  MEDANON_APP_DB_URL: ${MEDANON_APP_DB_URL:-postgresql://${MEDANON_APP_DB_USER:-medanon}:${MEDANON_APP_DB_PASSWORD:-medanon_dev}@app-db:5432/medanon}
  MEDANON_STAGING_RETENTION_DAYS: ${MEDANON_STAGING_RETENTION_DAYS:-30}
  # Bigger staging batches => fewer Pass-1/gPAS/NLP cycles, larger gPAS dedup
  # window (better cache hit-rate), and fewer Postgres round-trips. 5000 is
  # safe for 8-CPU/3GB workers; drop to 2000 for 4-CPU/2GB.
  MEDANON_STAGING_BATCH_SIZE: ${MEDANON_STAGING_BATCH_SIZE:-5000}
  # Skip staged path for jobs below this row count; use fast stream executor.
  MEDANON_STAGED_THRESHOLD_ROWS: ${MEDANON_STAGED_THRESHOLD_ROWS:-500000}
  # Process-level parallelism for the staged worker bypasses the Python GIL.
  # Each process gets its own ``MEDANON_PARALLEL_WORKERS`` thread pool, so
  # total CPU usage = PROCESS_WORKERS * PARALLEL_WORKERS. Default 4 leaves
  # 2 CPUs of the 8-CPU worker free for I/O.
  MEDANON_STAGING_PROCESS_WORKERS: ${MEDANON_STAGING_PROCESS_WORKERS:-4}
  # Rows per partition for shards mode. Smaller = better load balance.
  MEDANON_PARTITION_TARGET_ROWS: ${MEDANON_PARTITION_TARGET_ROWS:-10000}
  MEDANON_FHIR_FETCH_PARALLEL: ${MEDANON_FHIR_FETCH_PARALLEL:-4}
  MEDANON_COHORT_PARALLEL: ${MEDANON_COHORT_PARALLEL:-4}
  MEDANON_BATCH_SIZE: ${MEDANON_BATCH_SIZE:-1000}
  # With process workers, threads-per-process should stay modest to avoid
  # GIL contention. 4 is the sweet spot once PROCESS_WORKERS=4.
  MEDANON_PARALLEL_WORKERS: ${MEDANON_PARALLEL_WORKERS:-4}
  # Headroom for 4 processes × 32 threads + integration sub-pools.
  MEDANON_GLOBAL_MAX_THREADS: ${MEDANON_GLOBAL_MAX_THREADS:-128}
  # gPAS sub-batch executor (independent from the global pool).
  GPAS_SUBBATCH_PARALLEL: ${GPAS_SUBBATCH_PARALLEL:-16}
  # NLP client — parallel sub-batches when a single chunk exceeds
  # NLP_MAX_BATCH_ITEMS. Match this to the NLP service's NLP_BATCH_THREADS.
  NLP_CLIENT_SUBBATCH_PARALLEL: ${NLP_CLIENT_SUBBATCH_PARALLEL:-8}
  # Bigger anonymizer-side L1 cache => fewer NLP RPCs across batches.
  MEDANON_NLP_CACHE_MAX_ENTRIES: ${MEDANON_NLP_CACHE_MAX_ENTRIES:-500000}
  MEDANON_SEEN_VALUES_CAP: ${MEDANON_SEEN_VALUES_CAP:-1000000}
  MEDANON_PROGRESS_INTERVAL: ${MEDANON_PROGRESS_INTERVAL:-500}
  MEDANON_PIPELINE_ENABLED: ${MEDANON_PIPELINE_ENABLED:-true}
  MEDANON_PIPELINE_QUEUE_SIZE: ${MEDANON_PIPELINE_QUEUE_SIZE:-4}
  MEDANON_WORKERS: ${MEDANON_WORKERS:-4}
  MEDANON_REQUEST_TIMEOUT_SEC: ${MEDANON_REQUEST_TIMEOUT_SEC:-120}
  MEDANON_UPLOAD_BATCH_SIZE: ${MEDANON_UPLOAD_BATCH_SIZE:-500}
  MEDANON_UPLOAD_PARALLEL: ${MEDANON_UPLOAD_PARALLEL:-4}
  MEDANON_RESULT_STORAGE: ${MEDANON_RESULT_STORAGE:-local}
  MEDANON_RESULT_TTL_SEC: ${MEDANON_RESULT_TTL_SEC:-604800}
  MEDANON_RESULT_CLEANUP_INTERVAL_SEC: ${MEDANON_RESULT_CLEANUP_INTERVAL_SEC:-3600}
  FHIR_SOURCE_URL: ${FHIR_SOURCE_URL:-}
  FHIR_SOURCE_TOKEN: ${FHIR_SOURCE_TOKEN:-}
  FHIR_TARGET_URL: ${FHIR_TARGET_URL:-http://hapi-fhir-target:8080/fhir}
  FHIR_TARGET_TOKEN: ${FHIR_TARGET_TOKEN:-}
  FHIR_PAGE_SIZE: ${FHIR_PAGE_SIZE:-500}
  FHIR_POOL_SIZE: ${FHIR_POOL_SIZE:-10}
  MEDANON_TARGET_CONFIG_PROFILE: ${MEDANON_TARGET_CONFIG_PROFILE:-structural}
  # MINIO_ROOT_USER/PASSWORD must be set in .env when MEDANON_RESULT_STORAGE=s3.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-medanon-results}
  # Analytics microservice — always running on processing-net, no profile needed.
  # Proxied by /analyse/risk and /generate/synthetic endpoints.
  ANALYTICS_SERVICE_URL: http://analytics:8100
  # NLP microservice — always running, no profile needed.
  # Proxied by nlp_scrub / nlp_detect actions via RemoteNlpAdapter.
  NLP_SERVICE_URL: http://nlp-lb:8200
  # Scoring microservice — always running, no profile needed.
  # Proxied by pipeline.scoring.engine.score_resource via RemoteScoringClient.
  # Anonymizer falls back to local in-process scoring if the service is unreachable.
  SCORING_SERVICE_URL: ${SCORING_SERVICE_URL:-http://scoring:8300}
  # AI agent integration — disabled by default.
  # Set MEDANON_AI_ENABLED=true and configure the provider to enable AI features.
  MEDANON_AI_ENABLED: ${MEDANON_AI_ENABLED:-false}
  MEDANON_AI_PROVIDER: ${MEDANON_AI_PROVIDER:-ollama/llama3.1}
  MEDANON_AI_API_BASE: ${MEDANON_AI_API_BASE:-http://ollama:11434}
  MEDANON_AI_API_KEY: ${MEDANON_AI_API_KEY:-}
  MEDANON_AI_PII_PROVIDER: ${MEDANON_AI_PII_PROVIDER:-}
  MEDANON_PII_GATE: ${MEDANON_PII_GATE:-false}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-}

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── 0. API Gateway (Traefik) ──────────────────────────────────────────────
  # Replaces the legacy nginx gpas-lb + nlp-lb containers with a single
  # service-mesh-aware gateway.  Routes are configured via Docker labels on
  # the gpas / nlp services (see their respective definitions below).
  #
  # Backward compatibility: the gateway joins processing-net under the legacy
  # network aliases ``gpas-lb`` and ``nlp-lb`` so existing GPAS_URL /
  # NLP_SERVICE_URL values (e.g. ``http://gpas-lb:80/...``) keep working
  # without any .env changes.
  gateway:
    image: traefik:v3.2
    container_name: medanon-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Two entrypoints mirror the legacy LB ports so existing client URLs
      # continue to resolve.
      - --entrypoints.gpas.address=:80
      - --entrypoints.nlp.address=:8200
      # Built-in observability surface.
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.metrics.address=:8082
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "${GPAS_PORT:-8080}:80"
      - "${NLP_PORT:-8200}:8200"
    volumes:
      # Read-only socket mount — Traefik discovers labels but cannot mutate.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      processing-net:
        aliases:
          - gpas-lb
          - nlp-lb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 96M
    security_opt:
      - no-new-privileges:true

  # FHIR de-identification / anonymiser ──────────────────────────────────
  anonymizer:
    build:
      context: services/anonymizer
      dockerfile: Dockerfile
      target: api
    image: ${ANONYMIZER_IMAGE:-medanon:latest}
    container_name: medanon
    restart: unless-stopped
    ports:
      - "${ANONYMIZER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      <<: *worker-env
      GPAS_ADMIN_URL: ${GPAS_ADMIN_URL:-}
      MEDANON_CORS_ORIGINS: ${MEDANON_CORS_ORIGINS}
      MEDANON_MAX_BODY_BYTES: ${MEDANON_MAX_BODY_BYTES}
      MEDANON_AUDIT_LOG_FILE: /output/audit.log
      MEDANON_WORKER_ENABLED: ${MEDANON_WORKER_ENABLED:-false}
      MEDANON_NLP_PREWARM: ${MEDANON_NLP_PREWARM:-false}
    volumes:
      - ./data:/data:ro
      - ./output:/output
    networks:
      - processing-net  # gPAS, Redis, NLP, analytics, app-db
      - source-net      # source HAPI (read-only fetch)
      - target-net      # target HAPI (write de-identified results)
    depends_on:
      gateway:
        condition: service_healthy
      analytics:
        condition: service_healthy
      scoring:
        condition: service_healthy
      gpas:
        condition: service_healthy
      nlp:
        condition: service_healthy
      fhir-server:
        condition: service_healthy
      fhir-target:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${ANONYMIZER_CPU_LIMIT:-4.0}"
          memory: 3G
        reservations:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M

  # Dedicated job worker (same image, no HTTP server) ────────────────
  # Handles async jobs (bulk-export, cohort, patient-export, bulk-import, reprocess)
  # independently from the web server. The anonymizer defaults to
  # MEDANON_WORKER_ENABLED=false so jobs are only executed here.
  worker:
    build:
      context: services/anonymizer
      dockerfile: Dockerfile
      target: worker
    image: ${WORKER_IMAGE:-medanon-worker:latest}
    # container_name intentionally absent — allows `--scale worker=N` and
    # prevents port-binding conflicts when running multiple replicas.
    # Scale via: make up  (reads WORKER_REPLICAS from .env, default 2)
    restart: unless-stopped
    # ENTRYPOINT is baked into the worker stage; no override needed.
    env_file:
      - .env
    environment:
      <<: *worker-env
      MEDANON_WORKER_METRICS_PORT: "9091"
      # Shards mode: each worker claims partitions independently via
      # FOR UPDATE SKIP LOCKED.  The last replica to finish calls _merge_shards.
      MEDANON_OUTPUT_MODE: ${MEDANON_OUTPUT_MODE:-shards}
    expose:
      - "9091"
    volumes:
      - ./output:/output
    networks:
      - processing-net  # gPAS, Redis, NLP, analytics, app-db
      - source-net      # source HAPI (read-only fetch)
      - target-net      # target HAPI (write de-identified results)
    depends_on:
      gateway:
        condition: service_healthy
      nlp:
        condition: service_healthy
      gpas:
        condition: service_healthy
      fhir-target:
        condition: service_healthy
      analytics:
        condition: service_healthy
      scoring:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-8.0}"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9091/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 2. HAPI FHIR source server (source-net only) ───────────────────────────
  # Holds identified patient data. Only anonymizer/worker can reach it.
  # No processing-net service can initiate connections here.
  fhir-server:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir
    restart: unless-stopped
    # Source FHIR server holds identified patient data — intentionally NOT published
    # to a host port. Only anonymizer/worker on source-net can connect to it.
    # To inspect the source FHIR during development:
    #   docker compose exec fhir-server curl http://localhost:8080/fhir/metadata
    # Or override with: HAPI_EXPOSED_PORT=8081 in .env and add a ports section in
    # an override file (docker-compose.override.yml).
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_SERVER_ADDRESS:-http://localhost:8080/fhir}
      - HAPI_DB_USER=${HAPI_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_DB_NAME:-hapi}
      - JAVA_TOOL_OPTIONS=-Xms256M -Xmx1536M -XX:MetaspaceSize=128M -XX:MaxMetaspaceSize=256M -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./services/fhir-server/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - source-net
    depends_on:
      hapi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── 3. HAPI FHIR source PostgreSQL (source-net only) ──────────────────────
  hapi-db:
    image: postgres:16-alpine
    container_name: hapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_DB_NAME:-hapi}
    volumes:
      - hapi-pg-data:/var/lib/postgresql/data
    networks:
      - source-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_DB_USER:-hapi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # HAPI FHIR target server (target-net) ──────────────────────────────
  # Holds de-identified data. Isolated on target-net — only anonymizer, worker,
  # and UI can reach it. gPAS, Redis, NLP, and analytics have no path to it.
  fhir-target:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir-target
    restart: unless-stopped
    ports:
      - "${HAPI_TARGET_PORT:-8082}:8080"
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_TARGET_SERVER_ADDRESS:-http://localhost:8082/fhir}
      - HAPI_DB_USER=${HAPI_TARGET_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_TARGET_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_TARGET_DB_NAME:-hapi_target}
      - JAVA_TOOL_OPTIONS=-Xms256M -Xmx1536M -XX:MetaspaceSize=128M -XX:MaxMetaspaceSize=256M -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./services/fhir-target/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - target-net
    depends_on:
      hapi-target-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HAPI FHIR target PostgreSQL (target-net) ──────────────────────────
  hapi-target-db:
    image: postgres:16-alpine
    container_name: hapi-target-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_TARGET_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_TARGET_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_TARGET_DB_NAME:-hapi_target}
    volumes:
      - hapi-target-pg-data:/var/lib/postgresql/data
    networks:
      - target-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_TARGET_DB_USER:-hapi} -d ${HAPI_TARGET_DB_NAME:-hapi_target}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # ── 4. gPAS PostgreSQL database (processing-net) ──────────────────────────
  gpas-db:
    image: postgres:16-alpine
    container_name: gpas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpas
      POSTGRES_USER: ${GPAS_DB_USER:-gpas_user}
      POSTGRES_PASSWORD: ${GPAS_DB_PASSWORD:-gpas_password}
      TZ: Europe/Berlin
    volumes:
      - ./services/gpas/sqls_pg:/docker-entrypoint-initdb.d
      - gpas-db-data:/var/lib/postgresql/data
    networks:
      - processing-net
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c max_connections=150
      -c timezone=Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GPAS_DB_USER:-gpas_user} -d gpas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ── 5. gPAS TTP pseudonymisation service (processing-net) ─────────────────
  # No container_name or static host-port binding here — both would block
  # `docker compose up --scale gpas=N`.  External access goes via the Traefik
  # gateway which exposes the legacy ``gpas-lb`` network alias on port 80.
  # Anonymizer/worker route through ``http://gpas-lb:80/...`` (re-resolved on
  # every request via Docker DNS, so scaling gpas adds replicas to the pool).
  gpas:
    image: mosaicgreifswald/wildfly:38
    restart: unless-stopped
    env_file:
      - ./services/gpas/envs/ttp_commons.env
      - ./services/gpas/envs/ttp_fhir.env
      - ./services/gpas/envs/ttp_gpas.env
      - ./services/gpas/envs/ttp_gras.env
      - ./services/gpas/envs/ttp_noti.env
      - ./services/gpas/envs/wf_commons.env
    environment:
      MOS_WAIT_FOR_PORTS: gpas-db:5432:120
      TZ: Europe/Berlin
      TTP_GPAS_DB_USER: ${GPAS_DB_USER:-gpas_user}
      TTP_GPAS_DB_PASS: ${GPAS_DB_PASSWORD:-gpas_password}
    depends_on:
      gpas-db:
        condition: service_healthy
    volumes:
      - ./services/gpas/jboss:/entrypoint-wildfly-cli
      - ./services/gpas/jboss_pg/configure_00_postgresql_driver.cli:/entrypoint-wildfly-cli/configure_00_postgresql_driver.cli
      - ./services/gpas/jboss_pg/configure_wildfly_gras.cli:/entrypoint-wildfly-cli/configure_wildfly_gras.cli
      - ./services/gpas/jboss_pg/configure_wildfly_noti_service-2025.2.0.cli:/entrypoint-wildfly-cli/configure_wildfly_noti_service-2025.2.0.cli
      - ./services/gpas/deployments:/entrypoint-wildfly-deployments
      - ./services/gpas/addins:/entrypoint-wildfly-addins
    networks:
      - processing-net
    labels:
      # ── Traefik routing (replaces the legacy gpas-lb nginx container) ──
      - traefik.enable=true
      - traefik.docker.network=medanon-processing-net
      # FHIR API path — round-robin across all gpas replicas (default LB).
      - traefik.http.routers.gpas-fhir.entrypoints=gpas
      - traefik.http.routers.gpas-fhir.rule=PathPrefix(`/`)
      - traefik.http.routers.gpas-fhir.priority=1
      - traefik.http.routers.gpas-fhir.service=gpas-svc
      - traefik.http.services.gpas-svc.loadbalancer.server.port=8080
      # JSF web UI — sticky cookie keeps each session pinned to one replica
      # so WildFly's in-memory ViewState does not raise ViewExpiredException.
      - traefik.http.routers.gpas-web.entrypoints=gpas
      - traefik.http.routers.gpas-web.rule=PathPrefix(`/gpas-web`) || PathPrefix(`/gras-web`)
      - traefik.http.routers.gpas-web.priority=10
      - traefik.http.routers.gpas-web.service=gpas-web-svc
      - traefik.http.services.gpas-web-svc.loadbalancer.server.port=8080
      - traefik.http.services.gpas-web-svc.loadbalancer.sticky.cookie.name=gpas_session
      - traefik.http.services.gpas-web-svc.loadbalancer.sticky.cookie.httpOnly=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ttp-fhir/fhir/gpas/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
        reservations:
          cpus: "0.5"
          memory: 384M
    security_opt:
      - no-new-privileges:true

  # Analytics microservice (opt-in) ────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    image: medanon-analytics:latest
    container_name: medanon-analytics
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8100}:8100"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Scoring microservice ────────────────────────────────────────
  # Stateless composite privacy/utility/quality scoring.
  # Anonymizer/worker call this via SCORING_SERVICE_URL with local fallback.
  scoring:
    build:
      context: services/scoring
      dockerfile: Dockerfile
    image: medanon-scoring:latest
    container_name: medanon-scoring
    restart: unless-stopped
    expose:
      - "8300"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # NLP microservice ────────────────────────────────────────
  # Scale with: docker compose up --scale nlp=2
  # External access goes through the Traefik gateway under the legacy
  # ``nlp-lb`` network alias on port 8200, so NLP_SERVICE_URL stays the same.
  nlp:
    build:
      context: services/nlp
      dockerfile: Dockerfile
    image: medanon-nlp:latest
    restart: unless-stopped
    expose:
      - "8200"
    environment:
      # ── L2 cache (Redis) — shared across replicas, survives restarts.
      # Uses DB 2 to stay isolated from anonymizer L2 (db 0) and job queue (db 1).
      NLP_REDIS_URL: ${NLP_REDIS_URL:-redis://:${MEDANON_REDIS_PASSWORD:-}@redis:6379/2}
      NLP_REDIS_TTL_SEC: ${NLP_REDIS_TTL_SEC:-604800}
      # Threads used by /v1/detect/batch when all items are detect-only and by
      # the new mixed-batch parallel detect path. spaCy releases the GIL for
      # most pipeline components, so 8 threads scale near-linearly on 4 CPUs.
      NLP_BATCH_THREADS: ${NLP_BATCH_THREADS:-8}
      # Larger batches => fewer HTTP round-trips between anonymizer and NLP.
      # Must stay <= the client's _NLP_CLIENT_BATCH_LIMIT default (also 2000).
      NLP_MAX_BATCH_ITEMS: ${NLP_MAX_BATCH_ITEMS:-2000}
    networks:
      - processing-net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      # ── Traefik routing (replaces the legacy nlp-lb nginx container) ──
      - traefik.enable=true
      - traefik.docker.network=medanon-processing-net
      - traefik.http.routers.nlp.entrypoints=nlp
      - traefik.http.routers.nlp.rule=PathPrefix(`/`)
      - traefik.http.services.nlp.loadbalancer.server.port=8200
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${NLP_CPU_LIMIT:-4.0}"
          memory: ${NLP_MEMORY_LIMIT:-3G}
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # gPAS PostgreSQL read replica  ──────────────────────────
  # Horizontal gPAS scaling : run `docker compose up --scale gpas=2`
  # to start multiple WildFly instances sharing gpas-db.  The gpas-lb service
  # load-balances all traffic (anonymizer/worker route through gpas-lb).
  # For PostgreSQL read replicas (analytics/backup), enable this profile ─ it
  # requires manual streaming-replication bootstrap or a PG operator.
  gpas-db-replica:
    image: postgres:16-alpine
    container_name: gpas-postgres-replica
    profiles: [ha]
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpas
      POSTGRES_USER: ${GPAS_DB_USER:-gpas_user}
      POSTGRES_PASSWORD: ${GPAS_DB_PASSWORD:-gpas_password}
      TZ: Europe/Berlin
    volumes:
      - gpas-db-replica-data:/var/lib/postgresql/data
    networks:
      - processing-net
    depends_on:
      gpas-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GPAS_DB_USER:-gpas_user} -d gpas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # React UI (processing-net + source-net + target-net) ──────────────
  # Needs source-net for /fhir/ proxy (Patient Browser).
  # Needs target-net for /fhir-target/ proxy (Target Browser).
  ui:
    build:
      context: client
      dockerfile: Dockerfile
    image: medanon-ui:latest
    container_name: medanon-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    networks:
      - processing-net
      - source-net
      - target-net
    depends_on:
      anonymizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # App-state PostgreSQL (processing-net) ─────────────────────────────
  app-db:
    image: postgres:16-alpine
    container_name: medanon-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medanon
      POSTGRES_USER: ${MEDANON_APP_DB_USER:-medanon}
      POSTGRES_PASSWORD: ${MEDANON_APP_DB_PASSWORD:-medanon_dev}
    volumes:
      - app-pg-data:/var/lib/postgresql/data
      - ./services/anonymizer/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - processing-net
    command: >
      postgres
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDANON_APP_DB_USER:-medanon} -d medanon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # PostgreSQL's entrypoint needs CAP_CHOWN + CAP_SETUID to chown the data
    # directory and drop from root to the postgres user.  Dropping ALL caps
    # breaks every startup with "Operation not permitted".  Consistent with
    # hapi-db and gpas-db which also omit cap_drop.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

  # Redis (processing-net) ────────────────────────────────────────────
  # Note: Redis logs "WARNING Memory overcommit must be enabled!" on Linux VMs.
  # This is a host kernel setting — fix with: sudo sysctl -w vm.overcommit_memory=1
  # (add to /etc/sysctl.conf for persistence). Not fixable inside the container.
  redis:
    image: redis:7-alpine
    container_name: medanon-redis
    restart: unless-stopped
    user: redis
    # AOF persistence is REQUIRED.  The gPAS pseudonym cache (and the NLP
    # detection cache) must survive Redis restarts — otherwise the second bulk
    # run is as slow as the first because every value is a fresh L2 miss.
    # `volatile-lru` only evicts keys with an explicit TTL, so the no-TTL
    # pseudonym entries are pinned for the lifetime of the dataset.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy volatile-lru
      --maxclients ${REDIS_MAXCLIENTS:-2000}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --requirepass ${MEDANON_REDIS_PASSWORD:?MEDANON_REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MEDANON_REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # MinIO object storage (opt-in: MEDANON_RESULT_STORAGE=s3) ──────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: medanon-minio
    profiles: [s3]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Ollama LLM (opt-in AI) ──────────────────────────────────────────
  # Local LLM server for AI agent features.  Only needed when running AI
  # co-located; otherwise point MEDANON_AI_API_BASE to a remote Ollama VM.
  # Usage: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    container_name: medanon-ollama
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - processing-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Monitoring stack (opt-in) ─────────────────────────────────────────────
  # Usage: docker compose --profile monitoring up
  # Prometheus scrapes all services; Grafana is proxied through the UI nginx
  # at /grafana/ so dashboards are accessible within the SPA; cAdvisor
  # exposes per-container CPU/memory metrics to Prometheus.

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: medanon-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - processing-net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:11.1.0
    container_name: medanon-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - processing-net
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: medanon-cadvisor
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - processing-net
    ports:
      - "${CADVISOR_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
