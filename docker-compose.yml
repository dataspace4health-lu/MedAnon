# ─────────────────────────────────────────────────────────────────────────────
# MedAnon — full stack
# Usage:
#   docker compose up              # start all services
#   docker compose up anonymizer   # start only the anonymizer
#   docker compose down -v         # tear down + remove volumes
# ─────────────────────────────────────────────────────────────────────────────

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fhir-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  gpas-db-data:
  gpas-db-replica-data:
  hapi-pg-data:
  hapi-target-pg-data:
  redis-data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── 1. FHIR de-identification / anonymiser ──────────────────────────────────
  anonymizer:
    build:
      context: .
      dockerfile: services/anonymizer/Dockerfile
      target: prod
    image: ${ANONYMIZER_IMAGE:-medanon:latest}
    container_name: medanon
    restart: unless-stopped
    ports:
      - "${ANONYMIZER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - GPAS_URL=${GPAS_URL}
      - GPAS_DOMAIN=${GPAS_DOMAIN}
      - GPAS_OPERATION=${GPAS_OPERATION}
      - GPAS_TIMEOUT_SEC=${GPAS_TIMEOUT_SEC}
      - GPAS_ADMIN_URL=${GPAS_ADMIN_URL:-}
      - GPAS_TOKEN=${GPAS_TOKEN:-}
      - GPAS_BASIC_USER=${GPAS_BASIC_USER:-}
      - GPAS_BASIC_PASS=${GPAS_BASIC_PASS:-}
      - GPAS_CACHE_ENABLED=${GPAS_CACHE_ENABLED:-true}
      - GPAS_RETRY_COUNT=${GPAS_RETRY_COUNT:-2}
      - GPAS_RETRY_BACKOFF_SEC=${GPAS_RETRY_BACKOFF_SEC:-0.2}
      - MEDANON_CORS_ORIGINS=${MEDANON_CORS_ORIGINS}
      - MEDANON_MAX_BODY_BYTES=${MEDANON_MAX_BODY_BYTES}
      - MEDANON_HASH_KEY=${MEDANON_HASH_KEY:-}
      - FHIR_SOURCE_URL=${FHIR_SOURCE_URL:-}
      - FHIR_SOURCE_TOKEN=${FHIR_SOURCE_TOKEN:-}
      - FHIR_TARGET_URL=${FHIR_TARGET_URL:-http://hapi-fhir-target:8080/fhir}
      - FHIR_TARGET_TOKEN=${FHIR_TARGET_TOKEN:-}
      - MEDANON_TARGET_CONFIG_PROFILE=${MEDANON_TARGET_CONFIG_PROFILE:-structural}
      - MEDANON_AUDIT_LOG_FILE=/output/audit.log
      - MEDANON_REDIS_URL=${MEDANON_REDIS_URL:-redis://redis:6379/0}
      - MEDANON_JOB_WORKERS=${MEDANON_JOB_WORKERS:-3}
      - MEDANON_MANIFEST_ENABLED=${MEDANON_MANIFEST_ENABLED:-true}
      - MEDANON_STAGING_DB_URL=${MEDANON_STAGING_DB_URL:-}
      - MEDANON_STAGING_RETENTION_DAYS=${MEDANON_STAGING_RETENTION_DAYS:-30}
      - MEDANON_STAGING_BATCH_SIZE=${MEDANON_STAGING_BATCH_SIZE:-500}
    volumes:
      - ./data:/data:ro
      - ./output:/output
    networks:
      - fhir-net
    depends_on:
      gpas:
        condition: service_healthy
      fhir-server:
        condition: service_healthy
      fhir-target:
        condition: service_healthy
      redis:
        condition: service_healthy
      hapi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M

  # ── 2. HAPI FHIR server (PostgreSQL backend) ──────────────────────────────
  fhir-server:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir
    restart: unless-stopped
    ports:
      - "${HAPI_PORT:-8081}:8080"
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_SERVER_ADDRESS:-http://localhost:8080/fhir}
      - HAPI_DB_USER=${HAPI_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_DB_NAME:-hapi}
      - JAVA_TOOL_OPTIONS=-Xmx2g
    volumes:
      - ./services/fhir-server/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - fhir-net
    depends_on:
      hapi-db:
        condition: service_healthy
    healthcheck:
      # HealthCheck.class must be compiled targeting the same Java version as this
      # image (currently Java 17). Run `make build-healthcheck` to recompile, or
      # `make up` which does it automatically.
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── 3. HAPI FHIR PostgreSQL database ──────────────────────────────────────
  hapi-db:
    image: postgres:16-alpine
    container_name: hapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_DB_NAME:-hapi}
    volumes:
      - hapi-pg-data:/var/lib/postgresql/data
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_DB_USER:-hapi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── 3b. HAPI FHIR target PostgreSQL database (de-identified data) ──────────
  hapi-target-db:
    image: postgres:16-alpine
    container_name: hapi-target-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HAPI_TARGET_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_TARGET_DB_PASSWORD}
      POSTGRES_DB: ${HAPI_TARGET_DB_NAME:-hapi_target}
    volumes:
      - hapi-target-pg-data:/var/lib/postgresql/data
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HAPI_TARGET_DB_USER:-hapi} -d ${HAPI_TARGET_DB_NAME:-hapi_target}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── 2b. HAPI FHIR target server (de-identified data store) ────────────────
  fhir-target:
    image: hapiproject/hapi:v7.6.0
    container_name: hapi-fhir-target
    restart: unless-stopped
    ports:
      - "${HAPI_TARGET_PORT:-8082}:8080"
    environment:
      - hapi.fhir.fhir_version=${HAPI_FHIR_VERSION:-R4}
      - HAPI_SERVER_ADDRESS=${HAPI_TARGET_SERVER_ADDRESS:-http://localhost:8082/fhir}
      - HAPI_DB_USER=${HAPI_TARGET_DB_USER:-hapi}
      - HAPI_DB_PASSWORD=${HAPI_TARGET_DB_PASSWORD}
      - HAPI_DB_NAME=${HAPI_TARGET_DB_NAME:-hapi_target}
      - JAVA_TOOL_OPTIONS=-Xmx2g
    volumes:
      - ./services/fhir-target/config/application.yaml:/app/config/application.yaml:ro
      - ./services/fhir-server/healthcheck:/healthcheck:ro
    networks:
      - fhir-net
    depends_on:
      hapi-target-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "HealthCheck"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── 4. gPAS MySQL database ────────────────────────────────────────────────
  gpas-db:
    # Pin to 8.0 (LTS). mysql_native_password flag ensures WildFly's JDBC connector
    # can authenticate without needing caching_sha2_password support (which hangs
    # on login when the Connector/J version bundled in WildFly doesn't support it).
    image: mysql:8.0
    container_name: gpas-mysql
    restart: unless-stopped
    environment:
      # Always set GPAS_MYSQL_ROOT_PASSWORD in your .env or environment. Never commit real secrets.
      MYSQL_ROOT_PASSWORD: ${GPAS_MYSQL_ROOT_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - ./services/gpas/sqls:/docker-entrypoint-initdb.d
      - gpas-db-data:/var/lib/mysql
    networks:
      - fhir-net
    command: --max_allowed_packet=20M --default-time-zone=Europe/Berlin --innodb_buffer_pool_size=512M --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ── 5. gPAS TTP pseudonymisation service (official mosaicgreifswald) ───────
  gpas:
    image: mosaicgreifswald/wildfly:38
    container_name: gpas-wildfly
    restart: unless-stopped
    ports:
      - "${GPAS_PORT:-8080}:8080"
    env_file:
      - ./services/gpas/envs/ttp_commons.env
      - ./services/gpas/envs/ttp_fhir.env
      - ./services/gpas/envs/ttp_gpas.env
      - ./services/gpas/envs/ttp_gras.env
      - ./services/gpas/envs/ttp_noti.env
      - ./services/gpas/envs/wf_commons.env
    environment:
      MOS_WAIT_FOR_PORTS: gpas-db:3306:120
      TZ: Europe/Berlin
    depends_on:
      gpas-db:
        condition: service_healthy
    volumes:
      - ./services/gpas/jboss:/entrypoint-wildfly-cli
      - ./services/gpas/deployments:/entrypoint-wildfly-deployments
      - ./services/gpas/addins:/entrypoint-wildfly-addins
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ── 6. Analytics microservice (opt-in — start with: docker compose --profile analytics up) ─
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    image: medanon-analytics:latest
    container_name: medanon-analytics
    profiles: [analytics]
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8100}:8100"
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── 7. NLP microservice (opt-in — start with: docker compose --profile nlp up) ────────────
  nlp:
    build:
      context: .
      dockerfile: services/nlp/Dockerfile
    image: medanon-nlp:latest
    container_name: medanon-nlp
    profiles: [nlp]
    restart: unless-stopped
    ports:
      - "${NLP_PORT:-8200}:8200"
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M
        reservations:
          cpus: "0.5"
          memory: 800M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── 8. gPAS MySQL read replica (opt-in HA — start with: docker compose --profile ha up) ───
  # The replica mirrors the primary gpas-db using MySQL binary replication.
  # gPAS (WildFly) always writes to the primary; the replica is read-only and
  # is useful for audit queries, backups, and reducing read load.
  #
  # Initialisation: after starting both containers run once:
  #   docker exec gpas-mysql mysql -uroot -p${GPAS_MYSQL_ROOT_PASSWORD} \
  #     -e "GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%' IDENTIFIED BY '${GPAS_REPL_PASSWORD}';"
  #   docker exec gpas-mysql-replica mysql -uroot -p${GPAS_MYSQL_ROOT_PASSWORD} \
  #     -e "CHANGE MASTER TO MASTER_HOST='gpas-db', MASTER_USER='repl', \
  #         MASTER_PASSWORD='${GPAS_REPL_PASSWORD}', MASTER_AUTO_POSITION=1; START SLAVE;"
  gpas-db-replica:
    image: mysql:8.0
    container_name: gpas-mysql-replica
    profiles: [ha]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GPAS_MYSQL_ROOT_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - gpas-db-replica-data:/var/lib/mysql
    networks:
      - fhir-net
    depends_on:
      gpas-db:
        condition: service_healthy
    command: >
      --server-id=2
      --read-only=ON
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --max_allowed_packet=20M
      --default-time-zone=Europe/Berlin
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  # ── 9. React UI ──────────────────────────────────────────────────────────
  ui:
    build:
      context: client
      dockerfile: Dockerfile
    image: medanon-ui:latest
    container_name: medanon-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    networks:
      - fhir-net
    depends_on:
      anonymizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── 10. Redis (shared cache + job queue) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medanon-redis
    restart: unless-stopped
    user: redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis-data:/data
    networks:
      - fhir-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
