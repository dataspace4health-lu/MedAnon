# NLP microservice load balancer — least_conn upstream.
#
# nginx resolves "nlp" at config load time and creates one upstream entry
# per replica IP returned by Docker DNS.  New replicas added after the LB
# starts require `docker compose exec nlp-lb nginx -s reload` to be picked up.
# Scale before starting (or reload after scaling) to include all replicas.

upstream nlp_backend {
    least_conn;
    server nlp:8200;
    keepalive 32;
}

server {
    listen 8200;

    client_max_body_size 10m;

    location = /health {
        access_log  off;
        proxy_pass            http://nlp_backend/health;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        proxy_pass            http://nlp_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection         "";
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }
}
