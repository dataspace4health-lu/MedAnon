# NLP microservice load balancer.
#
# When `docker compose --profile nlp up --scale nlp=N` is used, Docker's
# embedded DNS returns all container IPs for the "nlp" hostname.  nginx
# distributes requests across all replicas via DNS round-robin.
#
# IMPORTANT: nginx `upstream` blocks resolve DNS only at config load time.
# Using `set $backend` + `proxy_pass $backend` forces per-request DNS
# resolution through the `resolver` directive, which is essential for
# Docker scaling where container IPs change dynamically.

# Docker embedded DNS — re-resolve on every request so scaled replicas
# are picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8200;

    # Batch detection requests can carry many texts — match anonymizer body limit.
    client_max_body_size 10m;

    # Lightweight liveness probe answered by nginx itself (no upstream needed).
    location = /health {
        access_log  off;
        return 200  '{"status":"ok"}';
        add_header  Content-Type application/json;
    }

    # NLP detection requests — round-robin via DNS (Docker returns all
    # replica IPs).  The `set $backend` pattern forces runtime DNS
    # resolution on every request.
    location / {
        set $backend  http://nlp:8200;
        proxy_pass    $backend;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }
}
