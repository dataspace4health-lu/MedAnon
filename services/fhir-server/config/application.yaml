# ─────────────────────────────────────────────────────────────────────────────
# HAPI FHIR server configuration
# Mounted at /app/config/application.yaml inside the container.
# See https://github.com/hapifhir/hapi-fhir-jpaserver-starter for all options.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  main:
    allow-circular-references: true

  datasource:
    url: jdbc:h2:mem:fhir;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
        hbm2ddl:
          auto: update

hapi:
  fhir:
    fhir_version: R4
    # Public base URL for Bundle fullUrl and pagination links.
    # Set HAPI_SERVER_ADDRESS in .env (default: http://localhost:8081/fhir for local dev).
    server_address: ${HAPI_SERVER_ADDRESS:http://localhost:8081/fhir}

    # Validation
    validation:
      enabled: false       # set to true if you want profile validation

    # CORS — in-cluster service names only; no hardcoded IP addresses.
    cors:
      allow_Credentials: true
      allowed_origin:
        - http://medanon:8000
        - http://localhost:8000
        - http://localhost:8501

    # Bulk data / $export support
    bulk_export_enabled: false

    # Narrative generation (disable for de-identified data)
    narrative_enabled: false

    # Default page size for search results
    default_page_size: 20
    max_page_size: 200
