    strategy: date_year

- name: pseudonymize device identifier value
  match: Device.identifier.value
  action: gpas_pseudonymize
  params: *gpas

# ==========================================================
# 18. GLOBAL CATCH-ALL: names, telecom, addresses, identifiers
#     Fires last for any resource type not explicitly listed above
#     (e.g. Coverage, Claim, ExplanationOfBenefit).
#     The parent array is never removed — only the PII-bearing
#     leaf string values are replaced in place.
# ==========================================================

- name: pseudonymize all identifier values
  match: "*.identifier.value"
  action: gpas_pseudonymize
  params: *gpas

- name: mask all name family
  match: "*.name.family"
  action: substitute
  params: *redacted

- name: mask all name given
  match: "*.name.given"
  action: substitute
  params: *redacted

- name: mask all name text
  match: "*.name.text"
  action: substitute
  params: *redacted

- name: mask all name prefix
  match: "*.name.prefix"
  action: substitute
  params: *redacted

- name: mask all name suffix
  match: "*.name.suffix"
  action: substitute
  params: *redacted

- name: mask all telecom values
  match: "*.telecom.value"
  action: substitute
  params: *redacted

- name: mask all address line
  match: "*.address.line"
  action: substitute
  params: *redacted

- name: mask all address city
  match: "*.address.city"
  action: substitute
  params: *redacted

- name: mask all address district
  match: "*.address.district"
  action: substitute
  params: *redacted

- name: mask all address postal code
  match: "*.address.postalCode"
  action: substitute
  params: *redacted

- name: mask all address state
  match: "*.address.state"
  action: substitute
  params: *redacted

- name: mask all address country
  match: "*.address.country"
  action: substitute
  params: *redacted

- name: mask all address text
  match: "*.address.text"
  action: substitute
  params: *redacted

# Coverage / insurance reference display names and direct identifiers
- name: mask coverage subscriber id
  match: Coverage.subscriberId
  action: substitute
  params: *redacted

- name: mask coverage dependent
  match: Coverage.dependent
  action: substitute
  params: *redacted

- name: mask coverage subscriber display
  match: Coverage.subscriber.display
  action: cryptohash

- name: mask coverage beneficiary display
  match: Coverage.beneficiary.display
  action: cryptohash

- name: mask coverage payor display
  match: Coverage.payor.display
  action: cryptohash
