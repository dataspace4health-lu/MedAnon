# ==========================================================
# 10. SERVER METADATA
# ==========================================================

- name: redact meta last updated
  match: "*.meta.lastUpdated"
  action: redact

- name: redact meta version id
  match: "*.meta.versionId"
  action: redact

- name: redact meta source
  match: "*.meta.source"
  action: redact

# ==========================================================
# 11. BINARY / DOCUMENT BLOBS
#    No meaningful text substitute — removed entirely
# ==========================================================

- name: redact attachments
  match: "*.attachment"
  action: redact

- name: redact document reference content
  match: DocumentReference.content
  action: redact

- name: redact binary data
  match: Binary.data
  action: redact

# ==========================================================
# 12. FREE-TEXT NARRATIVE — scrub PII tokens in place
#     scrub_text/nlp_scrub replace PII inline; field stays present
# ==========================================================

- name: scrub narrative text
  match: "*.text"
  action: scrub_text
  params:
    mode: html_tokenize
    patterns: all
    extract_names: true

- name: nlp scrub narrative text
  match: "*.text"
  action: nlp_scrub
  params:
    mode: tokenize
    html: true
    threshold: 0.4

- name: nlp scrub note text
  match: "*.note.text"
  action: nlp_scrub
  params:
    mode: tokenize
    threshold: 0.4

- name: nlp detect act comment fields
  match: "*.comment"
  action: nlp_detect_act
  params:
    threshold: 0.4

- name: nlp scrub code text
  match: "*.code.text"
  action: nlp_scrub
  params:
    mode: tokenize
    threshold: 0.4

- name: nlp scrub substance text
  match: "*.substance.text"
  action: nlp_scrub
  params:
    mode: tokenize
    threshold: 0.4

- name: nlp scrub value codeable concept text
  match: "*.valueCodeableConcept.text"
  action: nlp_scrub
  params:
    mode: tokenize
    threshold: 0.4

- name: nlp scrub medication codeable concept text
  match: "*.medicationCodeableConcept.text"
  action: nlp_scrub
  params:
    mode: tokenize
    threshold: 0.4

# Street address pattern — fires on any valueString containing a recognizable
# address regardless of LOINC code or resource structure (covers PRAPARE 56799-0,
# custom SDOH panels, and any other free-text fields with address content).
# Two rules: one for top-level valueString, one for component.valueString
# (e.g. Observation.component in PRAPARE / SDOH panels).
- name: scrub street addresses in valueString
  match: "*.valueString"
  action: scrub_text
  params:
    mode: text
    patterns: street_address

- name: scrub street addresses in component valueString
  match: "*.component.valueString"
  action: scrub_text
  params:
    mode: text
    patterns: street_address

- name: nlp detect act valueString
  match: "*.valueString"
  action: nlp_detect_act
  params:
    threshold: 0.4

- name: nlp detect act dosage text
  match: "*.dosage.text"
  action: nlp_detect_act
  params:
    threshold: 0.4

- name: nlp detect act dosage patient instruction
  match: "*.dosage.patientInstruction"
  action: nlp_detect_act
  params:
    threshold: 0.4

- name: nlp detect act reaction description
  match: "*.reaction.description"
  action: nlp_detect_act
  params:
    threshold: 0.4

# ==========================================================
