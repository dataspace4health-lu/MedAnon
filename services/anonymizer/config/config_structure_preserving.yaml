# =============================================================================
# MedAnon Structure-Preserving De-identification Profile
# =============================================================================
# Version: 2.0
# Use case: De-identification that keeps the full FHIR structure intact.
#           Fields are never removed — PII text is replaced with [REDACTED],
#           IDs are pseudonymized via gPAS, and clinical data is untouched.
#
# Key properties:
#   - Same fields, same layout as original resource
#   - IDs and cross-references: gPAS pseudonymization (deterministic, reversible)
#   - PII text (names, addresses, telecom): replaced with [REDACTED]
#   - Dates (birth, death, clinical, encounter): generalised to year only
#   - Demographics (gender, marital status, extensions): redacted
#   - Server metadata (lastUpdated, versionId, source): redacted
#   - Device identifiers (UDI, serial, lot): redacted/substituted
#   - Clinical data (codes, values, measurements): unchanged
#   - Binary blobs (photo, attachment): redacted (no meaningful text substitute)
#
# Required env vars:
#   GPAS_URL        — gPAS server base URL (e.g. http://gpas:8080/ttp-fhir/fhir)
#   GPAS_DOMAIN     — pseudonym domain name configured in gPAS
#   GPAS_BASIC_USER — HTTP Basic Auth username
#   GPAS_BASIC_PASS — HTTP Basic Auth password
#
# Usage:
#   POST /process?config_profile=structural
#   POST /process/raw?config_profile=structural
# =============================================================================

general:
  appname: SPE-FHIR-BlackBox
  rewrite_references: true
  rewrite_text_ids: true
  # domain_map omitted — inherits _DEFAULT_DOMAIN_MAP from loader.py
  # Add domain_map: here to override specific resource types for this profile.

rules:

# ==========================================================
# 1. PSEUDONYMIZE ALL RESOURCE IDS
# ==========================================================

- name: pseudonymize resource ids
  match: "*.id"
  action: gpas_pseudonymize
  params: &gpas
    gpas_url: ${GPAS_URL}
    gpas_domain: ${GPAS_DOMAIN}
    gpas_operation: ${GPAS_OPERATION:-pseudonymizeAllowCreate}
    gpas_timeout_sec: ${GPAS_TIMEOUT_SEC:-30}

# ==========================================================
# 2. SUBJECT / PATIENT REFERENCE DISPLAY NAMES
#    References themselves are rewritten by rewrite_references: true
#    after IDs are pseudonymized — no explicit rule needed here.
# ==========================================================

- name: redact subject display
  match: "*.subject.display"
  action: substitute
  params: &redacted
    substitute_with: "[REDACTED]"

- name: redact patient display
  match: "*.patient.display"
  action: substitute
  params: *redacted

# ==========================================================
# 3. PATIENT DIRECT IDENTIFIERS
#    Fields stay present — text content is replaced
# ==========================================================

- name: redact patient name family
  match: Patient.name.family
  action: substitute
  params: *redacted

- name: redact patient name given
  match: Patient.name.given
  action: substitute
  params: *redacted

- name: redact patient name text
  match: Patient.name.text
  action: substitute
  params: *redacted

- name: redact patient name prefix
  match: Patient.name.prefix
  action: substitute
  params: *redacted

- name: redact patient name suffix
  match: Patient.name.suffix
  action: substitute
  params: *redacted

- name: redact patient telecom value
  match: Patient.telecom.value
  action: substitute
  params: *redacted

- name: redact patient address line
  match: Patient.address.line
  action: substitute
  params: *redacted

- name: redact patient address city
  match: Patient.address.city
  action: substitute
  params: *redacted

- name: redact patient address district
  match: Patient.address.district
  action: substitute
  params: *redacted

- name: redact patient address postal code
  match: Patient.address.postalCode
  action: substitute
  params: *redacted

- name: redact patient address text
  match: Patient.address.text
  action: substitute
  params: *redacted

# Geolocation (lat/lon) nested inside Patient.address.extension — re-identification PHI
- name: redact patient address geolocation
  match: Patient.address.extension
  action: redact

- name: pseudonymize patient identifier value
  match: Patient.identifier.value
  action: gpas_pseudonymize
  params: *gpas

- name: redact patient photo
  match: Patient.photo
  action: redact

- name: redact patient contact name family
  match: Patient.contact.name.family
  action: substitute
  params: *redacted

- name: redact patient contact name given
  match: Patient.contact.name.given
  action: substitute
  params: *redacted

- name: redact patient contact name text
  match: Patient.contact.name.text
  action: substitute
  params: *redacted

- name: redact patient contact telecom value
  match: Patient.contact.telecom.value
  action: substitute
  params: *redacted

- name: redact patient address state
  match: Patient.address.state
  action: substitute
  params: *redacted

- name: redact patient address country
  match: Patient.address.country
  action: substitute
  params: *redacted

- name: redact patient gender
  match: Patient.gender
  action: substitute
  params:
    substitute_with: "unknown"

- name: redact patient marital status
  match: Patient.maritalStatus
  action: redact

- name: redact patient multiple birth boolean
  match: Patient.multipleBirthBoolean
  action: redact

- name: redact patient multiple birth integer
  match: Patient.multipleBirthInteger
  action: redact

- name: redact patient communication
  match: Patient.communication
  action: redact

# ==========================================================
# 3. PATIENT EXTENSIONS (specific PHI handling instead of blanket redaction)
# ==========================================================

# US Core Race Extension - contains demographic information (PHI)
# Redact the whole ombCategory inner extension (not just its valueCoding) so the
# remaining Extension object always has value[x] — prevents FHIR R4 violation
# "missing required element: value" (LenientErrorHandler warning on HAPI).
- name: redact race omb category coding
  match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension.where(url='ombCategory')
  action: redact

- name: redact race text value
  match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-race').extension.where(url='text').valueString
  action: substitute
  params: *redacted

# US Core Ethnicity Extension - contains demographic information (PHI)
- name: redact ethnicity omb category coding
  match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity').extension.where(url='ombCategory')
  action: redact

- name: redact ethnicity text value
  match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity').extension.where(url='text').valueString
  action: substitute
  params: *redacted

# Mother's Maiden Name Extension - contains identifying information (PHI)
- name: redact mothers maiden name
  match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-mothersMaidenName').valueString
  action: substitute
  params: *redacted

# Birth Sex Extension - redact the whole extension (not just valueCode) so no
# orphaned Extension with only url remains (FHIR R4 requires value[x] or sub-extensions).
- name: redact birth sex
  match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-birthsex')
  action: redact

# Birth Place Extension - contains geographic identifiers (PHI)
- name: redact birth place city
  match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-birthPlace').valueAddress.city
  action: substitute
  params: *redacted

- name: redact birth place state
  match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-birthPlace').valueAddress.state
  action: substitute
  params: *redacted

- name: redact birth place country
  match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-birthPlace').valueAddress.country
  action: substitute
  params: *redacted

# Synthea-specific extensions - redact the whole extension so no orphaned
# Extension with only url remains (valueDecimal removal would trigger HAPI
# LenientErrorHandler "missing required element: value" warning).
- name: redact synthea disability adjusted life years
  match: Patient.extension.where(url='http://synthetichealth.github.io/synthea/disability-adjusted-life-years')
  action: redact

- name: redact synthea quality adjusted life years
  match: Patient.extension.where(url='http://synthetichealth.github.io/synthea/quality-adjusted-life-years')
  action: redact

# Patient record links — cross-patient associations can re-identify
- name: redact patient link
  match: Patient.link
  action: redact

# Patient deceased boolean — fact of death is sensitive even without a date
- name: redact patient deceased boolean
  match: Patient.deceasedBoolean
  action: redact

# General practitioner and managing organisation display names
- name: redact patient general practitioner display
  match: Patient.generalPractitioner.display
  action: substitute
  params: *redacted

- name: redact patient managing organization display
  match: Patient.managingOrganization.display
  action: substitute
  params: *redacted

# ==========================================================
# 4. BIRTH DATE / DECEASED DATE — year only
# ==========================================================

- name: generalise birth date to year
  match: Patient.birthDate
  action: generalize
  params:
    strategy: date_year

- name: generalise deceased date to year
  match: Patient.deceasedDateTime
  action: generalize
  params:
    strategy: date_year

