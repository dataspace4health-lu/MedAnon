# ==========================================================
# 9. CLINICAL DATES — generalise to year only
#    Preserves that a date exists but removes day-level precision
# ==========================================================

- name: generalise effective date to year
  match: "*.effectiveDateTime"
  action: generalize
  params:
    strategy: date_year

- name: generalise issued date to year
  match: "*.issued"
  action: generalize
  params:
    strategy: date_year

- name: generalise authored on to year
  match: "*.authoredOn"
  action: generalize
  params:
    strategy: date_year

- name: generalise recorded date to year
  match: "*.recordedDate"
  action: generalize
  params:
    strategy: date_year

- name: generalise onset date to year
