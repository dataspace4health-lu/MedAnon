# =============================================================================
# k-Anonymity Adaptive Generalization Profile
# =============================================================================
#
# This profile enables the risk-driven generalization engine.  Unlike all other
# profiles whose generalization levels are hand-picked per rule, this profile
# delegates QI generalization to the adaptive lattice solver, which:
#
#   1. Scans the full dataset's quasi-identifier distribution (out-of-core,
#      via the PostgreSQL staging layer).
#   2. Searches the generalization lattice for the *minimal* generalization
#      that guarantees target_k=5 (i.e. every equivalence class has ≥ 5
#      members), maximising data utility.
#   3. Suppresses patients in residual small classes (capped at 5% of total).
#   4. Reports the *achieved* k and suppression count in the job summary.
#
# Prerequisites
# -------------
# - MEDANON_STAGING_DB_URL must be set (requires the PostgreSQL staging layer).
# - Submit via POST /v1/jobs/risk-driven-export (not /process).
# - Static rules below are still applied for non-QI fields.
#
# Privacy model
# -------------
privacy_model:
  enabled: true
  target_k: 5                       # every equivalence class must have ≥ 5 members
  target_l: 2                       # optional: each class must have ≥ 2 distinct Condition codes
      # target_t: 0.2                   # optional t-closeness: max total-variation distance
                                    # between each class's Condition-code distribution and
                                    # the global one (0 = identical, 1 = maximally skewed)
  max_suppression: 0.05             # suppress at most 5% of Patients
  quasi_identifiers:
    - path: "Patient.gender"
      kind: category
    - path: "Patient.birthDate"
      kind: date
    - path: "Patient.address.postalCode"
      kind: zip
  sensitive_attribute:
    path: "Condition.code"          # used for l-diversity
  on_unsatisfiable: "max_generalize" # "fail" or "max_generalize"
  suppress_linked: true             # also suppress non-Patient resources linked to suppressed Patients

# ---------------------------------------------------------------------------
# Standard transformation rules (applied to all resources)
# These run via the normal rule-driven pipeline; QI fields are additionally
# overwritten by the adaptive solver for Patient resources.
# ---------------------------------------------------------------------------

general:
  rewrite_references: true
  rewrite_text_ids: false

nlp:
  # k-anonymity pipeline: NLP unavailability would silently leave QI text intact,
  # corrupting the suppression logic — fail hard.
  fail_mode: raise

rules:
  # -- Direct identifiers (always pseudonymize / redact) --------------------

  - name: "pseudonymize patient id"
    match: "Patient.id"
    action: gpas_pseudonymize

  - name: "pseudonymize condition subject"
    match: "Condition.subject.reference"
    action: gpas_pseudonymize

  - name: "redact patient name"
    match: "Patient.name"
    action: redact

  - name: "redact patient telecom"
    match: "Patient.telecom"
    action: redact

  - name: "redact patient communication"
    match: "Patient.communication"
    action: redact

  - name: "redact patient address line (keep city/state/zip for QI)"
    match: "Patient.address.line"
    action: redact

  - name: "redact patient address text"
    match: "Patient.address.text"
    action: redact

  - name: "redact patient marital status"
    match: "Patient.maritalStatus"
    action: redact

  - name: "redact patient multiple birth"
    match: "Patient.multipleBirth"
    action: redact

  - name: "redact patient photo"
    match: "Patient.photo"
    action: redact

  - name: "redact patient contact"
    match: "Patient.contact"
    action: redact

  - name: "redact patient general practitioner"
    match: "Patient.generalPractitioner"
    action: redact

  - name: "redact patient managing organization"
    match: "Patient.managingOrganization"
    action: redact

  - name: "redact patient link"
    match: "Patient.link"
    action: redact

  # -- QI fields: static defaults (solver will overwrite these for Patients) -
  # These rules ensure that if the profile is used outside the risk-driven
  # job (e.g. /process), a reasonable baseline generalization is applied.

  - name: "generalize birth date (static baseline)"
    match: "Patient.birthDate"
    action: generalize
    params:
      strategy: date_year

  - name: "generalize postal code (static baseline)"
    match: "Patient.address.postalCode"
    action: generalize
    params:
      strategy: zip_prefix
      prefix_length: 3

  # -- Free-text NLP scrubbing ----------------------------------------------

  - name: "nlp scrub condition note"
    match: "Condition.note.text"
    action: nlp_detect

  - name: "nlp scrub diagnostic report text"
    match: "DiagnosticReport.text.div"
    action: nlp_detect
