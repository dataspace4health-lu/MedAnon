# MedAnon / Data Privacy Toolkit login theme.
#
# Inherits Keycloak's base login templates (form logic, validation, i18n,
# error handling) and restyles them completely via medanon.css so the page is
# fully branded — not the default Keycloak look — without the fragility of
# overriding FreeMarker templates across Keycloak versions.
parent=keycloak
import=common/keycloak

styles=css/login.css css/medanon.css

# Brand
locales=en
