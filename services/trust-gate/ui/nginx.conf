# ---------------------------------------------------------------------------
# Trust Gate UI  standalone static frontend for the Trust Gate microservice.
# Serves a single-page app and reverse-proxies API calls to trust-gate:8400.
# Runs separately from the main MedAnon SPA (opt-in `trust` profile).
# ---------------------------------------------------------------------------
server {
    listen 8401;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS  re-resolve the trust-gate hostname on every request
    # so a restarted backend container's new IP is picked up within the TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # nginx's own liveness probe (Docker healthcheck)  never proxied.
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend assessment API.
    location /v1/ {
        set $tg http://trust-gate:8400;
        proxy_pass $tg;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Backend liveness, surfaced to the UI status indicator.
    location = /health {
        set $tg http://trust-gate:8400;
        proxy_pass $tg/health;
        proxy_set_header Host $host;
    }
}
