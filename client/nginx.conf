# ---------------------------------------------------------------------------
# MedAnon — nginx reverse proxy
#
# DNS re-resolution for all upstreams is handled by the resolver directive
# + set $variable proxy_pass pattern.  This ensures a restarted container's
# new Docker network IP is picked up within the resolver TTL (10 s) without
# needing to restart nginx itself.
# ---------------------------------------------------------------------------

server {
    listen 8501;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve all upstream hostnames on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to MedAnon backend.
    # Variable proxy_pass forces nginx to re-resolve "medanon" on every
    # request via the Docker embedded DNS resolver above.  A restarted
    # anonymizer container is therefore picked up within 10 s with no nginx
    # restart needed.
    location /api/ {
        set $anon_backend http://medanon:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $anon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so the backend always sees exactly the real
        # client IP.  $proxy_add_x_forwarded_for appends to whatever the client
        # sent, allowing IP spoofing to bypass rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        client_body_buffer_size 1m;
    }

    # Proxy FHIR calls to HAPI server.
    # Variable assignment forces nginx to re-resolve hapi-fhir via the Docker
    # DNS resolver on every request, so a restarted container's new IP is picked
    # up without restarting nginx.  rewrite strips the /fhir prefix so HAPI
    # receives /fhir/<resource> not /fhir/fhir/<resource>.
    location /fhir/ {
        set $fhir_upstream http://hapi-fhir:8080;
        rewrite ^/fhir/(.*)$ /fhir/$1 break;
        proxy_pass $fhir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy FHIR calls to target HAPI server (de-identified data).
    location /fhir-target/ {
        set $fhir_target_upstream http://hapi-fhir-target:8080;
        rewrite ^/fhir-target/(.*)$ /fhir/$1 break;
        proxy_pass $fhir_target_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Health check for Docker healthcheck
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
