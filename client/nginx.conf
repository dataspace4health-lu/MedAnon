# ---------------------------------------------------------------------------
# MedAnon — nginx reverse proxy
#
# DNS re-resolution for all upstreams is handled by the resolver directive
# + set $variable proxy_pass pattern.  This ensures a restarted container's
# new Docker network IP is picked up within the resolver TTL (10 s) without
# needing to restart nginx itself.
# ---------------------------------------------------------------------------

server {
    # TLS is REQUIRED. The SPA uses Authorization Code Flow + PKCE, which calls
    # window.crypto.subtle to build the code challenge. Browsers only expose
    # crypto.subtle in a "secure context" — i.e. HTTPS, or http://localhost.
    # Served over plain HTTP on an IP/hostname, login fails with
    # "Crypto.subtle is available only in secure contexts (HTTPS)".
    listen 8501 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # If a browser sends plain HTTP to this HTTPS port, redirect it to HTTPS
    # instead of returning a confusing "invalid response" error.
    error_page 497 =301 https://$http_host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve all upstream hostnames on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the SPA entry point and references content-hashed asset
    # chunks. It must NEVER be cached by the browser, otherwise after a UI
    # rebuild the browser keeps loading the old index.html → old chunk names →
    # stale UI (e.g. a missing newly-added field). Hashed /assets/ files remain
    # immutable (see below); only the entry point is revalidated every load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Proxy API calls to MedAnon backend.
    # Variable proxy_pass forces nginx to re-resolve "medanon" on every
    # request via the Docker embedded DNS resolver above.  A restarted
    # anonymizer container is therefore picked up within 10 s with no nginx
    # restart needed.
    location /api/ {
        set $anon_backend http://medanon:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $anon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so the backend always sees exactly the real
        # client IP.  $proxy_add_x_forwarded_for appends to whatever the client
        # sent, allowing IP spoofing to bypass rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        client_body_buffer_size 1m;
    }

    # Proxy Trust Gate calls — the pre-privacy data-quality assessment service.
    # Variable proxy_pass re-resolves "trust-gate" via Docker DNS on every
    # request. rewrite strips the /trust prefix so the service receives
    # /v1/trust/assess not /trust/v1/trust/assess. The trust-gate service is
    # opt-in (--profile trust); when it is not running these calls 502 and the
    # page surfaces an "offline" state.
    location /trust/ {
        set $trust_upstream http://trust-gate:8400;
        rewrite ^/trust/(.*)$ /$1 break;
        proxy_pass $trust_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        client_body_buffer_size 1m;
    }

    # Proxy FHIR calls to HAPI server.
    # Variable assignment forces nginx to re-resolve hapi-fhir via the Docker
    # DNS resolver on every request, so a restarted container's new IP is picked
    # up without restarting nginx.  rewrite strips the /fhir prefix so HAPI
    # receives /fhir/<resource> not /fhir/fhir/<resource>.
    location /fhir/ {
        set $fhir_upstream http://hapi-fhir:8080;
        rewrite ^/fhir/(.*)$ /fhir/$1 break;
        proxy_pass $fhir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy FHIR calls to target HAPI server (de-identified data).
    location /fhir-target/ {
        set $fhir_target_upstream http://hapi-fhir-target:8080;
        rewrite ^/fhir-target/(.*)$ /fhir/$1 break;
        proxy_pass $fhir_target_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy Grafana — embedded in the SPA monitoring page.
    # proxy_hide_header strips Grafana's own X-Frame-Options so we can control
    # framing here; add_header in a location replaces server-level headers for
    # that location, so all required security headers are restated explicitly.
    location /grafana/ {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        # Allow Grafana to be embedded only from the same origin
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Proxy Prometheus HTTP API — used by the monitoring page for native charts.
    location /prometheus/ {
        set $prom_upstream http://prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prom_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering off;
        # Restrict to read-only Prometheus API paths
        limit_except GET { deny all; }
    }

    # OIDC callback is a SPA (React Router) route, but it lives under /auth/ —
    # the same prefix proxied to Keycloak below. An EXACT-match location takes
    # precedence over the /auth/ prefix, so the post-login redirect to
    # /auth/callback?code=... is served by the SPA (index.html) instead of
    # being forwarded to Keycloak (which would 404 "Page not found").
    location = /auth/callback {
        try_files /index.html =404;
    }

    # Proxy Keycloak OIDC — must be before the SPA catch-all so /auth/ requests
    # reach Keycloak instead of falling through to index.html.
    location /auth/ {
        set $keycloak_upstream http://medanon-keycloak:8080;
        proxy_pass $keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # CRITICAL: the server-level "X-Frame-Options DENY" + strict CSP are
        # inherited by every location that sets no add_header of its own. That
        # DENY blocks Keycloak's OWN same-origin login-status iframe, which the
        # admin console loads to check the SSO session — the result is the
        # console hanging forever on "Loading the Administration Console".
        # Declaring add_header here cancels the inherited ones; we hide
        # Keycloak's duplicates and allow same-origin framing only.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Health check for Docker healthcheck
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS — browsers ignore this on plain HTTP, so it is safe to send everywhere.
    # Operators terminating TLS in front of this container automatically benefit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content Security Policy — locks the SPA to same-origin assets.
    # 'unsafe-inline' on style-src is required by Tailwind/Shadcn runtime utility
    # injection. Scripts are external (Vite production build) — no inline JS allowed.
    # connect-src 'self' covers /api, /fhir, /fhir-target proxied below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Plain-HTTP health endpoint on an internal-only port (NOT published to the
# host). Lets the Docker healthcheck probe without a TLS handshake against the
# self-signed cert, which busybox wget cannot verify.
server {
    listen 8500;
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    location / { return 404; }
}
