# ---------------------------------------------------------------------------
# MedAnon — nginx reverse proxy
#
# Horizontal scaling:
#   Replace the single "server medanon:8000" entry in the upstream block
#   with multiple replicas (Docker Compose scale / Kubernetes pod IPs).
#   nginx distributes requests with least_conn across all healthy backends.
#   Keepalive connections are reused to avoid per-request TCP overhead.
#
#   Example (3 replicas):
#     server medanon-1:8000;
#     server medanon-2:8000;
#     server medanon-3:8000;
#
#   In Kubernetes, point to the headless Service or use the ClusterIP Service
#   and let kube-proxy handle backend selection.
#
#   Shared storage note:
#     MEDANON_OUTPUT_DIR must map to a ReadWriteMany volume (NFS/EFS/Azure Files)
#     when running multiple anonymizer replicas so any replica can serve job results.
# ---------------------------------------------------------------------------

upstream anonymizer {
    least_conn;
    server medanon:8000;
    keepalive 16;
}

server {
    listen 8501;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to MedAnon backend
    location /api/ {
        proxy_pass http://anonymizer/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        client_body_buffer_size 1m;
    }

    # Proxy FHIR calls to HAPI server
    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy FHIR calls to target HAPI server (de-identified data)
    location /fhir-target/ {
        proxy_pass http://hapi-fhir-target:8080/fhir/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Health check for Docker healthcheck
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
