{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medanon.fullname" . }}
  labels:
    {{- include "medanon.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.className }}
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # React UI — SPA served via nginx (root path)
          # The UI's nginx also proxies /api/ and /fhir/ internally,
          # but direct Ingress routes are provided for non-browser clients.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-ui" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # MedAnon anonymizer API — direct access for CLI / external clients
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-anonymizer" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # HAPI FHIR server (identified data source)
          - path: /fhir
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-fhir-server" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # HAPI FHIR target server (de-identified data store)
          - path: /fhir-target
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-fhir-target" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # gPAS web UI
          - path: /gpas-web
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-gpas" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # gPAS TTP-FHIR gateway (internal service API)
          - path: /ttp-fhir
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-gpas" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
{{- end }}
