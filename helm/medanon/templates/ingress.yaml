{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medanon.fullname" . }}
  labels:
    {{- include "medanon.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.className }}
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Keycloak authentication
          {{- if .Values.keycloak.enabled }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-keycloak" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  number: {{ .Values.keycloak.port | default 8080 }}
          {{- end }}
          # MedAnon anonymizer API — root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-anonymizer" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
          # HAPI FHIR server — routed via fhir-proxy when enabled (login required)
          - path: /fhir
            pathType: Prefix
            backend:
              service:
                {{- if .Values.fhirProxy.enabled }}
                name: {{ printf "%s-fhir-proxy" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  number: {{ .Values.fhirProxy.port | default 4180 }}
                {{- else }}
                name: {{ printf "%s-fhir-server" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
                {{- end }}
          # gPAS web UI — routed via gpas-proxy when enabled (login required)
          - path: /gpas-web
            pathType: Prefix
            backend:
              service:
                {{- if .Values.gpasProxy.enabled }}
                name: {{ printf "%s-gpas-proxy" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  number: {{ .Values.gpasProxy.port | default 8082 }}
                {{- else }}
                name: {{ printf "%s-gpas" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
                {{- end }}
          # gPAS TTP-FHIR gateway (always direct — internal service API)
          - path: /ttp-fhir
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-gpas" .Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  name: http
{{- end }}
