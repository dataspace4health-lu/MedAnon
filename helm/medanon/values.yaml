# ─────────────────────────────────────────────────────────────────────────────
# MedAnon Umbrella Chart — default values
#
# Usage:
#   helm dependency update helm/medanon
#   helm upgrade --install medanon helm/medanon -f my-values.yaml
#
# Keys under anonymizer.*, fhir-server.*, gpas.*, and ui.* override the defaults
# in each sub-chart's own values.yaml.  Only list values that differ from
# the sub-chart defaults.
#
# global.* values are automatically propagated to all sub-charts.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Helm global values ───────────────────────────────────────────────────────
# These flow down into every sub-chart automatically.
global:
  # Container registry prefix for all images (leave empty for Docker Hub).
  # Example: "ghcr.io/your-org"
  registry: ""
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: my-registry-secret
  imagePullSecrets: []

# ─── Anonymizer overrides ─────────────────────────────────────────────────────
anonymizer:
  # When using the umbrella, set this to "<release>-gpas" so the anonymizer
  # waits for gPAS before starting.  Example: "medanon-gpas"
  gpasServiceName: ""

  env:
    # In-cluster gPAS URL — set to http://<release>-gpas:8080/ttp-fhir/fhir/gpas
    GPAS_URL: ""
    # In-cluster FHIR source URL — set to http://<release>-fhir-server:8080/fhir
    FHIR_SOURCE_URL: ""
    FHIR_SOURCE_TOKEN: ""
    # In-cluster FHIR target URL — set to http://<release>-fhir-target:8080/fhir
    FHIR_TARGET_URL: ""
    FHIR_TARGET_TOKEN: ""
    # Profile used by /process/and-upload and /process/round-trip.
    # structural keeps full FHIR structure, pseudonymizes IDs, rewrites all references.
    MEDANON_TARGET_CONFIG_PROFILE: "structural"
    # Opt-in microservice URLs. Leave empty to run analytics/NLP in-process.
    # When analytics sub-chart is enabled, set to http://<release>-analytics:8100
    ANALYTICS_SERVICE_URL: ""
    # When NLP sub-chart is deployed (future), set to http://<release>-nlp:8200
    NLP_SERVICE_URL: ""
    # Redis URL for cross-replica gPAS cache. Leave empty for per-process LRU.
    MEDANON_REDIS_URL: ""

  secrets:
    MEDANON_HASH_KEY: ""
    # REQUIRED: set via --set or a sealed secret for any non-local deployment.
    GPAS_BASIC_USER: ""
    GPAS_BASIC_PASS: ""
    GPAS_TOKEN: ""
    rsaPublicKey: ""
    rsaPrivateKey: ""

# ─── FHIR Server overrides ────────────────────────────────────────────────────
fhir-server:
  # Public base URL for Bundle fullUrl and pagination links.
  serverAddress: ""

# ─── FHIR Target Server overrides (de-identified data store) ─────────────────
# Uses the same fhir-server sub-chart via Helm alias.
# Set db.postgresql.host to the PostgreSQL service for the target instance.
fhir-target:
  serverAddress: ""
  db:
    type: postgresql
    postgresql:
      host: ""
      port: 5432
      database: hapi_target
      username: hapi
      password: ""

# ─── gPAS overrides ───────────────────────────────────────────────────────────
gpas:
  secrets:
    # REQUIRED: set via --set or a sealed secret. Generate: openssl rand -base64 24
    WF_ADMIN_PASS: ""
    WF_ADMIN_USER: ""
  db:
    secrets:
      # REQUIRED: set via --set or a sealed secret. Generate: openssl rand -base64 24
      rootPassword: ""

# ─── Analytics microservice overrides (Phase 3 — opt-in) ─────────────────────
# Deploy the analytics sub-chart by setting analytics.enabled=true.
# When deployed, also set anonymizer.env.ANALYTICS_SERVICE_URL to
# http://<release>-analytics:8100 so the anonymizer proxies to it.
analytics:
  enabled: false
  env:
    # Comma-separated CORS origins exposed by the analytics service.
    MEDANON_CORS_ORIGINS: ""

# ─── UI overrides ────────────────────────────────────────────────────────────
# React SPA served via nginx. The nginx config proxies /api/ and /fhir/
# to the anonymizer and fhir-server services using in-cluster DNS names.
ui:
  # In-cluster service names for nginx upstream proxy.
  # Set to "<release>-anonymizer" and "<release>-fhir-server".
  anonymizerServiceName: ""
  fhirServerServiceName: ""
  # Target FHIR server proxy — set to "<release>-fhir-target" to expose /fhir-target/ in nginx.
  fhirTargetServiceName: ""
  fhirTargetPort: 8080

# ─── Ingress (optional) ───────────────────────────────────────────────────────
# Routes external traffic to the correct sub-chart service.
# Service names are computed as: <release>-<chart-name>
#   /             → <release>-ui             :8501  (React SPA + nginx proxy)
#   /api          → <release>-anonymizer     :8000  (direct API access)
#   /fhir         → <release>-fhir-server    :8080
#   /fhir-target  → <release>-fhir-target    :8080
#   /gpas-web     → <release>-gpas           :8080
#   /ttp-fhir     → <release>-gpas           :8080
#
# NOTE: fullnameOverride is not supported for sub-charts when ingress is enabled,
# as service names are derived from the release name.
ingress:
  enabled: false

  # Ingress class name (e.g. "nginx", "traefik")
  className: ""

  # Single host for all services.
  host: ""

  tls:
    enabled: false
    secretName: "medanon-tls"


