  - name: fhir-server
    version: "0.1.0"
    repository: "file://../charts/fhir-server"
  - name: gpas
    version: "0.1.0"
    repository: "file://../charts/gpas"
  - name: ui
    version: "0.1.0"
    repository: "file://../charts/ui"
