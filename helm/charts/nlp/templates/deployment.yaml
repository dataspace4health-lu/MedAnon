{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nlp.fullname" . }}
  labels:
    {{- include "nlp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "nlp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nlp.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "false"
        {{- with .Values.global.mtls }}
        {{- if and .enabled (eq .provider "linkerd") }}
        linkerd.io/inject: "enabled"
        {{- end }}
        {{- if and .enabled (eq .provider "istio") }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nlp
          {{- $registry := coalesce .Values.global.registry .Values.registry }}
          image: "{{ if $registry }}{{ $registry }}/{{ end }}{{ .Values.image }}:{{ .Values.tag }}"
          imagePullPolicy: {{ coalesce .Values.global.imagePullPolicy .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: NLP_WORKERS
              value: {{ .Values.workers | quote }}
            {{- if .Values.redisUrl }}
            - name: NLP_REDIS_URL
              value: {{ .Values.redisUrl | quote }}
            - name: NLP_REDIS_TTL_SEC
              value: {{ .Values.redisTtlSec | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
{{- end }}
