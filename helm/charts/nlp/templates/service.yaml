{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nlp.fullname" . }}
  labels:
    {{- include "nlp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "nlp.selectorLabels" . | nindent 4 }}
{{- end }}
