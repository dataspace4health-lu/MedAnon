# ─────────────────────────────────────────────────────────────────────────────
# gPAS Helm Chart  default values
#
# Includes the PostgreSQL database backend (db.*) since it has no lifecycle
# independent of gPAS itself.
#
# Customise with --set / -f my-values.yaml.
# When deployed via the fhir-diet umbrella chart, prefix keys with "gpas."
# ─────────────────────────────────────────────────────────────────────────────

# Helm global values  automatically populated by a parent (umbrella) chart.
# These defaults are only active when the chart is installed standalone.
global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

# Container registry prefix for the gPAS image.
# Sub-chart: overridden by global.registry from the parent if set.
registry: ""

# Default pull policy. Sub-chart: overridden by global.imagePullPolicy if set.
imagePullPolicy: IfNotPresent

# Optional image pull secrets.
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

# Use the custom image built from services/gpas/Dockerfile
# (bundles WAR/EAR deployments and WildFly CLI scripts)
image: medanon-gpas
# Pinned to chart appVersion. Override at install time with `--set tag=<version>`.
# Never use "latest" in production.
tag: "2025.2.0"

# Static replica count  ignored when autoscaling.enabled=true (HPA controls replicas).
replicas: 1
port: 8080

# ─── Horizontal Pod Autoscaler ────────────────────────────────────────────────
# Multiple gPAS WildFly instances share a single PostgreSQL database.
# Sequence contention (SELECT … FOR UPDATE on the sequence table) is negligible
# at batch_size=500 for up to 4 replicas.  For >4, consider adding PgBouncer.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# ─── Environment  non-secret config ─────────────────────────────────────────
env:
  # gRAS form-based auth for the gPAS web UI (/gpas-web/).
  # Options: gras | (anything else = no auth)
  TTP_GPAS_WEB_AUTH_MODE: "gras"

  # ── Database driver selection ────────────────────────────────────────────
  # gPAS WildFly defaults to MySQL when this is unset. The chart-managed DB
  # is PostgreSQL, so this MUST stay "postgresql".
  TTP_GPAS_DB_DBMS: "postgresql"
  TTP_GPAS_DB_PORT: "5432"
  TTP_GPAS_DB_NAME: "gpas"
  # gRAS schema lives inside the gpas database (?currentSchema=gras).
  TTP_GRAS_DB_PORT: "5432"
  TTP_GRAS_DB_NAME: "gpas"
  # notification_service schema lives inside the gpas database
  # (?currentSchema=notification_service).
  TTP_NOTI_DB_PORT: "5432"
  TTP_NOTI_DB_NAME: "gpas"

  # PostgreSQL hostname  leave empty to use the DB Service name computed from
  # this chart's fullname (recommended). Override only when pointing at an
  # external database.
  TTP_DB_HOST: ""
  TTP_GPAS_DB_HOST: ""
  TTP_GRAS_DB_HOST: ""
  TTP_NOTI_DB_HOST: ""

  # Wait for PostgreSQL before starting WildFly (host:port:timeout_seconds).
  # Leave empty to use the computed DB service name and db.port.
  MOS_WAIT_FOR_PORTS: ""

  TZ: "Europe/Berlin"
  WF_NO_ADMIN: "true"
  WF_HEALTHCHECK_URLS: "http://localhost:8080/"

# ─── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  # WildFly management console credentials.
  # WF_NO_ADMIN=true disables the console, but credentials are still required internally.
  # REQUIRED: set via --set or a sealed secret for any non-local deployment.
  # Generate with: openssl rand -base64 24
  WF_ADMIN_PASS: ""
  WF_ADMIN_USER: ""

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "6Gi"
    cpu: "2000m"

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL database backend (exclusively for gPAS)
# ─────────────────────────────────────────────────────────────────────────────
db:
  # Pod-level security context for the PostgreSQL StatefulSet.
  # postgres:16-alpine entrypoint must run as root (UID 0) to chmod/chown the
  # data directory before dropping privileges  do not set runAsNonRoot here.
  # fsGroup ensures the mounted PVC is group-readable by the postgres process.
  podSecurityContext:
    fsGroup: 70
  # Container-level security context for the PostgreSQL container.
  # postgres:16-alpine starts as root and uses gosu to drop to UID 70;
  # dropping ALL capabilities breaks gosu (needs CAP_SETUID/CAP_SETGID).
  # For hardened production deployments consider a postgres sidecar pattern.
  containerSecurityContext:
    allowPrivilegeEscalation: false
  # PostgreSQL uses the official Docker Hub image; registry is intentionally not
  # prefixed by default so it always pulls from Docker Hub.
  # Set db.registry to override (e.g. for air-gapped clusters with a mirror).
  registry: ""
  image: postgres
  tag: "16-alpine"
  port: 5432

  # Persistent volume size for the PostgreSQL data directory.
  storage: "10Gi"
  storageClass: ""   # leave empty to use the cluster default StorageClass

  # PostgreSQL tuning flags passed as command arguments.
  # Tune shared_buffers to ~25% of pod memory limit.
  args:
    - "-c"
    - "shared_buffers=512MB"
    - "-c"
    - "max_connections=150"
    - "-c"
    - "timezone=Europe/Berlin"

  env:
    POSTGRES_DB: "gpas"
    TZ: "Europe/Berlin"

  secrets:
    # REQUIRED: set via --set or a sealed secret. Generate: openssl rand -base64 24
    postgresPassword: ""
    postgresUser: "gpas_user"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1000m"

  # ─── PostgreSQL streaming replica (opt-in HA profile) ─────────────────────
  # When enabled, a standby replica StatefulSet is deployed.
  # Bootstrap is manual: run pg_basebackup in an init container or use the
  # CloudNativePG / Crunchy Data PGO operator for fully-automated replication.
  # gPAS always writes to the primary; the replica is read-only (analytics/backups).
  replica:
    enabled: false
    storage: ""      # leave empty to inherit db.storage
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# Network policy configuration
networkPolicy:
  # Additional namespaces allowed to send ingress traffic (e.g. ingress controller namespace)
  additionalIngressNamespaces: []
