apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpas.fullname" . }}-secret
  labels:
    {{- include "gpas.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpas
type: Opaque
stringData:
  WF_ADMIN_PASS: {{ .Values.secrets.WF_ADMIN_PASS | quote }}
  WF_ADMIN_USER: {{ .Values.secrets.WF_ADMIN_USER | quote }}
  # gPAS / gRAS / notification_service DB credentials.
  # All three subsystems share the same PostgreSQL database (gpas) and login
  # role; schema isolation is via ?currentSchema= in the JDBC URL.
  TTP_GPAS_DB_USER: {{ .Values.db.secrets.postgresUser | quote }}
  TTP_GPAS_DB_PASS: {{ .Values.db.secrets.postgresPassword | quote }}
  TTP_GRAS_DB_USER: {{ .Values.db.secrets.postgresUser | quote }}
  TTP_GRAS_DB_PASS: {{ .Values.db.secrets.postgresPassword | quote }}
  TTP_NOTI_DB_USER: {{ .Values.db.secrets.postgresUser | quote }}
  TTP_NOTI_DB_PASS: {{ .Values.db.secrets.postgresPassword | quote }}
