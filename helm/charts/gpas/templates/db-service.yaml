apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpas.fullname" . }}-db
  labels:
    {{- include "gpas.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpas-db
spec:
  # Headless service  required for StatefulSet stable DNS names.
  # gPAS connects to "<fullname>-db:5432" via this service.
  clusterIP: None
  selector:
    {{- include "gpas.selectorLabels" (dict "Release" .Release "component" "gpas-db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.db.port }}
      targetPort: postgres
      protocol: TCP
