apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpas.fullname" . }}-db-secret
  labels:
    {{- include "gpas.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpas-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.secrets.postgresPassword | quote }}
  POSTGRES_USER: {{ .Values.db.secrets.postgresUser | quote }}
  # Used by the pg_basebackup init container when db.replica.enabled=true.
  # Set via --set db.secrets.replPassword=<secret> before enabling the replica.
  REPL_PASSWORD: {{ (.Values.db.secrets).replPassword | default "" | quote }}
