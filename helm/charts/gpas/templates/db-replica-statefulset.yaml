{{- if .Values.db.replica.enabled -}}
{{- $dbRegistry := coalesce .Values.db.registry .Values.global.registry "" -}}
# PostgreSQL streaming replica for gPAS — enabled with db.replica.enabled=true.
#
# Bootstrap (run once after both pods are healthy):
#   1. On the primary, create a replication role:
#      kubectl exec -n <ns> <primary-pod> -- \
#        psql -U ${POSTGRES_USER} -c \
#        "CREATE ROLE replicator REPLICATION LOGIN PASSWORD '${REPL_PASSWORD}';"
#
#   2. The replica init container automatically runs pg_basebackup using the
#      REPL_PASSWORD secret — no manual kubectl exec is needed after step 1.
#
# gPAS always connects to the primary.  The replica is read-only (analytics/backups).
# For production-grade HA consider the CloudNativePG or Crunchy Data PGO operator.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gpas.fullname" . }}-db-replica
  labels:
    {{- include "gpas.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpas-db-replica
spec:
  serviceName: {{ include "gpas.fullname" . }}-db-replica
  replicas: 1
  selector:
    matchLabels:
      {{- include "gpas.selectorLabels" (dict "Release" .Release "component" "gpas-db-replica") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpas.selectorLabels" (dict "Release" .Release "component" "gpas-db-replica") | nindent 8 }}
        {{- include "gpas.labels" . | nindent 8 }}
        app.kubernetes.io/component: gpas-db-replica
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Clone the primary on first boot using pg_basebackup.
      # -R creates standby.signal + primary_conninfo automatically (PG 12+).
      initContainers:
        - name: pg-basebackup
          image: "{{ if $dbRegistry }}{{ $dbRegistry }}/{{ end }}{{ .Values.db.image }}:{{ .Values.db.tag }}"
          command:
            - sh
            - -c
            - |
              if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
                echo "Data directory already initialized — skipping pg_basebackup."
                exit 0
              fi
              echo "Cloning primary at {{ include "gpas.dbHost" . }}:{{ .Values.db.port }} ..."
              pg_basebackup \
                -h {{ include "gpas.dbHost" . }} \
                -p {{ .Values.db.port }} \
                -U replicator \
                -D /var/lib/postgresql/data \
                -Fp -Xs -P -R
              echo "pg_basebackup complete."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpas.fullname" . }}-db-secret
                  key: REPL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres-replica
          image: "{{ if $dbRegistry }}{{ $dbRegistry }}/{{ end }}{{ .Values.db.image }}:{{ .Values.db.tag }}"
          imagePullPolicy: {{ coalesce .Values.global.imagePullPolicy .Values.imagePullPolicy | default "IfNotPresent" }}
          env:
            {{- range $k, $v := .Values.db.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "gpas.fullname" . }}-db-secret
          ports:
            - containerPort: {{ .Values.db.port }}
              name: postgres
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U ${POSTGRES_USER:-gpas_user} -d ${POSTGRES_DB:-gpas}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U ${POSTGRES_USER:-gpas_user} -d ${POSTGRES_DB:-gpas}"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.db.replica.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.db.storageClass }}
        storageClassName: {{ .Values.db.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.replica.storage | default .Values.db.storage }}
{{- end }}
