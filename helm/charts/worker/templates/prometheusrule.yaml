{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: medanon.worker.queue
      rules:
        - alert: MedanonWorkerDown
          expr: up{job=~".*{{ include "worker.fullname" . }}.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: worker
          annotations:
            summary: "Job worker is down"
            description: "Async jobs (bulk-export, cohort) will queue indefinitely."

        - alert: MedanonJobQueueGrowing
          expr: medanon_job_queue_depth > {{ .Values.monitoring.prometheusRule.thresholds.queueDepth | default "100" }}
          for: 15m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Job queue depth >{{ .Values.monitoring.prometheusRule.thresholds.queueDepth | default 100 }} for 15m"
            description: "Workers cannot keep up. Scale worker replicas or investigate stuck jobs."
{{- end }}
