global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

registry: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Same image as anonymizer  different entrypoint
image: medanon
# Pinned to chart appVersion. Override at install time with `--set tag=<version>`.
tag: "2025.2.0"
replicas: 1
metricsPort: 9091

env:
  GPAS_URL: ""
  GPAS_DOMAIN: "TESTING"
  GPAS_OPERATION: "pseudonymizeAllowCreate"
  GPAS_TIMEOUT_SEC: "30"
  GPAS_CACHE_ENABLED: "true"
  MEDANON_REDIS_URL: ""
  MEDANON_JOB_WORKERS: "3"
  MEDANON_MANIFEST_ENABLED: "false"
  FHIR_SOURCE_URL: ""
  FHIR_SOURCE_TOKEN: ""
  FHIR_TARGET_URL: ""
  FHIR_TARGET_TOKEN: ""

secrets:
  MEDANON_HASH_KEY: ""
  GPAS_BASIC_USER: ""
  GPAS_BASIC_PASS: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ─── Shared output PVC (job results) ─────────────────────────────────────────
# Same value as anonymizer.sharedOutputPVC  must reference the same PVC.
sharedOutputPVC: ""

# ─── Observability (Prometheus Operator) ───────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    thresholds:
      queueDepth: "100"            # alert when job queue depth exceeds this
