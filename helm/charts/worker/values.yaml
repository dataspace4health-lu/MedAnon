global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

registry: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Same image as anonymizer — different entrypoint
image: medanon
tag: latest
replicas: 1
metricsPort: 9091

env:
  GPAS_URL: ""
  GPAS_DOMAIN: "TESTING"
  GPAS_OPERATION: "pseudonymizeAllowCreate"
  GPAS_TIMEOUT_SEC: "30"
  GPAS_CACHE_ENABLED: "true"
  MEDANON_REDIS_URL: ""
  MEDANON_JOB_WORKERS: "3"
  MEDANON_MANIFEST_ENABLED: "false"
  FHIR_SOURCE_URL: ""
  FHIR_SOURCE_TOKEN: ""
  FHIR_TARGET_URL: ""
  FHIR_TARGET_TOKEN: ""

secrets:
  MEDANON_HASH_KEY: ""
  GPAS_BASIC_USER: ""
  GPAS_BASIC_PASS: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
