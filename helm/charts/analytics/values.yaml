# ─────────────────────────────────────────────────────────────────────────────
# MedAnon Analytics sub-chart — default values
#
# Enable from the umbrella chart: --set analytics.enabled=true
# ─────────────────────────────────────────────────────────────────────────────

# Master switch — must be true for this chart to be deployed.
enabled: false

global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

registry: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

image: medanon-analytics
# Pinned to chart appVersion. Override at install time with `--set tag=<version>`.
tag: "1.0.0"
replicas: 1
port: 8100

# ─── Observability (Prometheus Operator) ───────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    labels: {}

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"
