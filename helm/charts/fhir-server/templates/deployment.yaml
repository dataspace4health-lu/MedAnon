{{- $registry := coalesce .Values.registry .Values.global.registry "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fhir-server.fullname" . }}
  labels:
    {{- include "fhir-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "fhir-server.name" . }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "fhir-server.selectorLabels" (dict "Release" .Release "component" (include "fhir-server.name" .)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fhir-server.selectorLabels" (dict "Release" .Release "component" (include "fhir-server.name" .)) | nindent 8 }}
        {{- include "fhir-server.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "fhir-server.name" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Prometheus scraping (HAPI FHIR exposes metrics at /actuator/prometheus when enabled)
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.port }}"
        prometheus.io/path: "/actuator/prometheus"
        {{- with .Values.global.mtls }}
        {{- if and .enabled (eq .provider "linkerd") }}
        linkerd.io/inject: "enabled"
        {{- end }}
        {{- if and .enabled (eq .provider "istio") }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fhir-server.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fhir-server
          image: {{ include "fhir-server.image" (dict "registry" $registry "image" .Values.image "tag" .Values.tag) }}
          imagePullPolicy: {{ coalesce .Values.imagePullPolicy .Values.global.imagePullPolicy "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: hapi.fhir.fhir_version
              value: {{ .Values.fhirVersion | quote }}
            {{- if .Values.serverAddress }}
            - name: HAPI_SERVER_ADDRESS
              value: {{ .Values.serverAddress | quote }}
            {{- end }}
            {{- if eq .Values.db.type "postgresql" }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.db.postgresql.host }}:{{ .Values.db.postgresql.port }}/{{ .Values.db.postgresql.database }}"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            {{- if .Values.db.postgresql.existingSecret }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.postgresql.existingSecret }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.postgresql.existingSecret }}
                  key: password
            {{- else }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.db.postgresql.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.db.postgresql.password | default "" | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.javaOpts }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
              readOnly: true
            # JVM needs writable /tmp (readOnlyRootFilesystem=true)
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fhir-server.fullname" . }}-config
        - name: tmp
          emptyDir: {}
