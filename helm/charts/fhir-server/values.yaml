# ─────────────────────────────────────────────────────────────────────────────
# HAPI FHIR Server Helm Chart — default values
#
# Customise with --set / -f my-values.yaml.
# When deployed via the fhir-diet umbrella chart, prefix keys with "fhir-server."
# ─────────────────────────────────────────────────────────────────────────────

# Helm global values — automatically populated by a parent (umbrella) chart.
# These defaults are only active when the chart is installed standalone.
global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

# Container registry prefix.
# Sub-chart: overridden by global.registry from the parent if set.
registry: ""

# Default pull policy. Sub-chart: overridden by global.imagePullPolicy if set.
imagePullPolicy: IfNotPresent

# Optional image pull secrets.
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

image: hapiproject/hapi
tag: latest
replicas: 1
port: 8080

fhirVersion: R4

# Public base URL for Bundle fullUrl and pagination links.
# Should match the external URL clients use to reach HAPI FHIR.
# Example: "http://fhir.example.com/fhir"
serverAddress: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"
