# ─────────────────────────────────────────────────────────────────────────────
# HAPI FHIR Server Helm Chart  default values
#
# Customise with --set / -f my-values.yaml.
# When deployed via the fhir-diet umbrella chart, prefix keys with "fhir-server."
# ─────────────────────────────────────────────────────────────────────────────

# Helm global values  automatically populated by a parent (umbrella) chart.
# These defaults are only active when the chart is installed standalone.
global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

# Container registry prefix.
# Sub-chart: overridden by global.registry from the parent if set.
registry: ""

# Default pull policy. Sub-chart: overridden by global.imagePullPolicy if set.
imagePullPolicy: IfNotPresent

# Optional image pull secrets.
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

image: hapiproject/hapi
# Pinned to match docker-compose.yml. Override with `--set tag=<version>`.
tag: "v7.6.0"
replicas: 1
port: 8080

fhirVersion: R4

# Public base URL for Bundle fullUrl and pagination links.
# Should match the external URL clients use to reach HAPI FHIR.
# Example: "http://fhir.example.com/fhir"
serverAddress: ""

# JVM heap cap  passed as JAVA_TOOL_OPTIONS. Recommended: -Xms128m -Xmx512m
# Set to "" to disable (JVM will size heap from container memory limit).
javaOpts: "-Xms128m -Xmx512m"

# Additional environment variables (list of name/value maps)
extraEnv: []

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "768Mi"
    cpu: "1000m"

# Database backend.
#   type: "h2"           in-memory H2 (default; data lost on pod restart, dev/test only)
#   type: "postgresql"   external PostgreSQL (production)
db:
  type: h2
  postgresql:
    host: postgresql
    port: 5432
    database: hapi
    username: hapi
    password: ""
    # existingSecret: ""   # K8s Secret name with keys "username" and "password"

# Network policy configuration
networkPolicy:
  # Additional namespaces allowed to send ingress traffic (e.g. ingress controller namespace)
  additionalIngressNamespaces: []
