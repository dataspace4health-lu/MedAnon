apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.fullname" . }}-nginx
  labels:
    {{- include "ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
data:
  default.conf: |
    server {
        listen {{ .Values.port }};
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback  all non-file routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to MedAnon anonymizer
        location /api/ {
            proxy_pass http://{{ .Values.anonymizerServiceName }}:{{ .Values.anonymizerPort }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            {{- if .Values.injectApiKey }}
            proxy_set_header X-API-Key {{ .Values.injectApiKey | quote }};
            {{- end }}
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            # Tolerate transient pod restarts/rollouts  retry on connect refused
            # so a single anonymizer pod cycling does not surface as 502.
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
        }

        # Proxy FHIR calls to HAPI server (identified data source)
        location /fhir/ {
            proxy_pass http://{{ .Values.fhirServerServiceName }}:{{ .Values.fhirServerPort }}/fhir/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        {{- if .Values.fhirTargetServiceName }}
        # Proxy FHIR calls to target HAPI server (de-identified data store)
        location /fhir-target/ {
            proxy_pass http://{{ .Values.fhirTargetServiceName }}:{{ .Values.fhirTargetPort }}/fhir/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        {{- end }}

        # Health check
        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Cache static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
