{{- $registry := coalesce .Values.registry .Values.global.registry "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ui.fullname" . }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ui.selectorLabels" (dict "Release" .Release "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ui.selectorLabels" (dict "Release" .Release "component" "ui") | nindent 8 }}
        {{- include "ui.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
      annotations:
        # Force pod restart when nginx config changes
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.global.mtls }}
        {{- if and .enabled (eq .provider "linkerd") }}
        linkerd.io/inject: "enabled"
        {{- end }}
        {{- if and .enabled (eq .provider "istio") }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ui.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "ui.image" (dict "registry" $registry "image" .Values.image "tag" .Values.tag) }}
          imagePullPolicy: {{ coalesce .Values.imagePullPolicy .Values.global.imagePullPolicy "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          volumeMounts:
            # Override the baked-in nginx.conf with the ConfigMap version
            # so backend service names are configurable via values.yaml
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx needs writable dirs for pid, cache, and temp files
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "ui.fullname" . }}-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
