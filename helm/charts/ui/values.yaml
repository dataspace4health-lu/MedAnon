# ─────────────────────────────────────────────────────────────────────────────
# MedAnon React UI Helm Chart  default values
#
# Customise with --set / -f my-values.yaml.
# When deployed via the medanon umbrella chart, prefix keys with "ui."
# ─────────────────────────────────────────────────────────────────────────────

# Helm global values  automatically populated by a parent (umbrella) chart.
# These defaults are only active when the chart is installed standalone.
global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

# Container registry prefix  prepended to the image name.
# Leave empty to pull by image name directly.
# Sub-chart: overridden by global.registry from the parent if set.
registry: ""

# Default pull policy. Sub-chart: overridden by global.imagePullPolicy if set.
imagePullPolicy: IfNotPresent

# Optional image pull secrets (e.g. for private registries).
imagePullSecrets: []

image: medanon-ui
# Pinned to chart appVersion. Override at install time with `--set tag=<version>`.
# Never use "latest" in production.
tag: "2025.2.0"
replicas: 1

# When set, nginx injects this value as X-API-Key on every /api/ proxy request.
# Removes the need for users to configure the key in the browser Settings.
# Leave empty to require the browser to supply the key (default).
injectApiKey: ""
port: 8501

# ─── Backend service names (for nginx proxy_pass) ──────────────────────────
# In Kubernetes, these resolve via ClusterIP DNS.
# When using the umbrella chart, override with "<release>-anonymizer" and
# "<release>-fhir-server".
anonymizerServiceName: "anonymizer"
anonymizerPort: 8000
fhirServerServiceName: "fhir-server"
fhirServerPort: 8080
# Target FHIR server (de-identified data)  leave empty to disable the /fhir-target/ proxy.
# When using the umbrella chart, set to "<release>-fhir-target".
fhirTargetServiceName: ""
fhirTargetPort: 8080

# ─── Resources ──────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Network policy configuration
networkPolicy:
  # Additional namespaces allowed to send ingress traffic (e.g. ingress controller namespace)
  additionalIngressNamespaces: []
