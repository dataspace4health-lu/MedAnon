# =============================================================================
# Research-Grade Pseudonymous De-identification Profile for MedAnon
# =============================================================================
#
# Use case: Internal secondary analysis and clinical research datasets
#
# This profile is designed for datasets shared within a research environment
# under an Institutional Review Board (IRB) approval or equivalent ethical
# governance framework. It preserves more clinical detail than the HIPAA Safe
# Harbor profile to support temporal analysis, cohort studies, and
# epidemiological research.
#
# Key differences from HIPAA Safe Harbor (config_hipaa_safe_harbor.yaml):
#   - Dates generalized to YEAR-MONTH (not year-only) for temporal analysis
#   - Postal code retained as 3-digit prefix (not fully redacted)
#   - Patient IDs pseudonymized via cryptohash (not redacted), preserving
#     referential integrity across datasets for longitudinal studies
#   - Clinical notes scrubbed but not entirely removed; code-level data intact
#
# Strategy used:
#   cryptohash      → SHA3-256 hash for all resource IDs (reversible with key)
#   redact          → permanent deletion for names, contact details, photos
#   generalize      → date_year_month for all date fields; zip_prefix for
#                     postal codes
#
# WARNING  This profile is NOT suitable for:
#   - External data sharing or publication without further review
#   - Compliance with HIPAA Safe Harbor (dates retain month; use
#     config_hipaa_safe_harbor.yaml for that)
#   - EU/EEA data sharing under GDPR (use config_gdpr_eu.yaml)
#
# Governance requirements:
#   - Obtain IRB / ethics committee approval before use
#   - Document the legal basis for processing (e.g. Art. 89 GDPR for research)
#   - Restrict output access to named research personnel
#   - Log operator name and config hash in the evidence report
#     (use: python3 tools/analyze_results.py --operator NAME --config THIS_FILE)
#
# Covered resource types:
#   Patient, Practitioner, RelatedPerson, Organization, plus cross-resource
#   wildcards for IDs, date fields, references, and clinical text.
# =============================================================================

general:
  appname: MedAnon-Research
  hash_type: sha3_256
  rewrite_references: true
  rewrite_text_ids: true

rules:

  # ===========================================================================
  # 1. PATIENT  DIRECT IDENTIFIERS (redact completely)
  # ===========================================================================

  # Names  always redact (direct identifier)
  - match: Patient.name
    action: redact

  - match: Patient.contact.name
    action: redact

  # Contact details  redact (phone, fax, email, URL)
  - match: Patient.telecom
    action: redact

  - match: Patient.contact.telecom
    action: redact

  # Administrative identifiers (MRN, SSN, insurance, account numbers)
  - match: Patient.identifier
    action: redact

  # Photo / biometric data
  - match: Patient.photo
    action: redact

  # Patient merge links
  - match: Patient.link
    action: redact

  # Extensions - specific PHI handling for research use (may contain custom identifiers)
  - match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-race')
    action: redact

  - match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity')
    action: redact

  - match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-mothersMaidenName')
    action: redact

  - match: Patient.extension.where(url='http://hl7.org/fhir/us/core/StructureDefinition/us-core-birthsex')
    action: redact

  - match: Patient.extension.where(url='http://hl7.org/fhir/StructureDefinition/patient-birthPlace')
    action: redact

  - match: Patient.extension.where(url.startsWith('http://synthetichealth.github.io/synthea/'))
    action: redact

  # Quasi-identifiers  marital status and language are demographic attributes
  # that combine with clinical data to enable re-identification in small cohorts.
  - match: Patient.maritalStatus
    action: redact

  - match: Patient.communication
    action: redact

  # ===========================================================================
  # 2. PATIENT  QUASI-IDENTIFIERS (generalize, not redact)
  # Preserves statistical utility for cohort and temporal analysis.
  # ===========================================================================

  # Date of birth  year + month only (finer than Safe Harbor for temporal work)
  - match: Patient.birthDate
    action: generalize
    params:
      strategy: date_year_month

  - match: Patient.deceasedDateTime
    action: generalize
    params:
      strategy: date_year_month

  # Postal code  3-digit prefix (safe quasi-identifier for geographic analysis)
  - match: Patient.address.postalCode
    action: generalize
    params:
      strategy: zip_prefix
      prefix_length: 3

  # Remove street-level address lines but keep state and country
  - match: Patient.address.line
    action: redact

  - match: Patient.address.city
    action: redact

  - match: Patient.address.district
    action: redact

  # Geolocation (lat/lon) nested inside Patient.address.extension  re-identification PHI
  - name: redact patient address geolocation
    match: Patient.address.extension
    action: redact

  - match: Patient.contact.address
    action: redact

  # ===========================================================================
  # 3. PRACTITIONER / RELATED PERSON / ORGANIZATION
  # ===========================================================================

  - match: Practitioner.name
    action: redact

  - match: Practitioner.identifier
    action: redact

  - match: Practitioner.birthDate
    action: generalize
    params:
      strategy: date_year_month

  - match: Practitioner.telecom
    action: redact

  - match: Practitioner.address
    action: redact

  - match: Practitioner.photo
    action: redact

  - match: RelatedPerson.name
    action: redact

  - match: RelatedPerson.identifier
    action: redact

  - match: RelatedPerson.birthDate
    action: generalize
    params:
      strategy: date_year_month

  - match: RelatedPerson.telecom
    action: redact

  - match: RelatedPerson.address
    action: redact

  - match: RelatedPerson.photo
    action: redact

  - match: Organization.name
    action: redact

  - match: Organization.identifier
    action: redact

  - match: Organization.telecom
    action: redact

  - match: Organization.address
    action: redact

  # ===========================================================================
  # 4. CROSS-RESOURCE WILDCARDS
  # Pseudonymize all resource IDs with cryptohash  preserves referential
  # integrity across resources in longitudinal / multi-resource datasets.
  # ===========================================================================

  - match: "*.id"
    action: cryptohash

  # Generalize all clinical date/time fields to year-month
  - match: "*.effectiveDateTime"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.effectivePeriod.start"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.effectivePeriod.end"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.issued"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.authoredOn"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.recordedDate"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.occurrenceDateTime"
    action: generalize
    params:
      strategy: date_year_month

  - match: "*.performedDateTime"
    action: generalize
    params:
      strategy: date_year_month

  # Redact display strings in references (may contain patient name)
  - match: "*.subject.display"
    action: redact

  - match: "*.patient.display"
    action: redact

  - match: "*.display"
    action: nlp_detect_act
    params:
      entities: healthcare

  # ===========================================================================
  # 5. SDOH / PRAPARE QUASI-IDENTIFIERS
  # PRAPARE (LOINC panel 93025-5) components carry social-determinant data
  # that are quasi-identifiers in research cohorts: income, household size,
  # education, language, and employment status can link records even after
  # pseudonymization. Street address (LOINC 56799-0) is caught by the
  # scrub_text street_address rule below.
  # ===========================================================================

  - name: redact PRAPARE annual income
    match: "Observation.component.where(code.coding.where(code='63586-2').exists())"
    action: redact

  - name: redact PRAPARE household size
    match: "Observation.component.where(code.coding.where(code='63512-8').exists())"
    action: redact

  - name: redact PRAPARE education level
    match: "Observation.component.where(code.coding.where(code='82589-3').exists())"
    action: redact

  - name: redact PRAPARE preferred language
    match: "Observation.component.where(code.coding.where(code='54899-0').exists())"
    action: redact

  - name: redact PRAPARE employment status
    match: "Observation.component.where(code.coding.where(code='67875-5').exists())"
    action: redact

  # ===========================================================================
  # 6. CLINICAL TEXT SCRUBBING
  # Preserve structured clinical codes (Condition, Observation, Medication).
  # Scrub free-text narrative and notes where names/addresses may appear.
  # ===========================================================================

  - match: "*.text.div"
    action: scrub_text
    params:
      mode: html_tokenize
      patterns: all

  - match: "*.text.div"
    action: nlp_scrub
    params:
      mode: tokenize
      html: true
      threshold: 0.4

  - match: "*.note.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  # Street address pattern  fires on any valueString containing a recognizable
  # address regardless of LOINC code or resource structure (covers PRAPARE 56799-0,
  # custom SDOH panels, and any other free-text fields with address content).
  # Two rules: one for top-level valueString, one for component.valueString
  # (e.g. Observation.component in PRAPARE / SDOH panels).
  - name: scrub street addresses in valueString
    match: "*.valueString"
    action: scrub_text
    params:
      mode: text
      patterns: street_address

  - name: scrub street addresses in component valueString
    match: "*.component.valueString"
    action: scrub_text
    params:
      mode: text
      patterns: street_address

  - match: "*.valueString"
    action: nlp_detect_act
    params:
      threshold: 0.4

  # Identifier type labels disclose PHI categories even when values are pseudonymized
  - name: redact identifier type text labels
    match: "*.identifier.type.text"
    action: redact

  - name: redact identifier type coding display labels
    match: "*.identifier.type.coding.display"
    action: redact

  - match: "*.comment"
    action: nlp_detect_act
    params:
      threshold: 0.4

  # ===========================================================================
  # DOCUMENTS / ATTACHMENTS  IRB-grade scrubbing
  # text/* payloads: Base64-decoded → NLP-scrubbed → re-encoded.
  # Longitudinal linkage is preserved via gPAS ID pseudonymisation; attachment
  # free text must be scrubbed to remove residual direct identifiers.
  # Non-text MIME types (image/*, application/pdf …): data field redacted.
  # NOTE: *.attachment.data does NOT match DocumentReference  the attachment is
  # nested under content[*].attachment, so specific paths are required per resource.
  # ===========================================================================

  # DocumentReference  clinical notes (content[*].attachment, nested one level)
  - name: scrub document reference attachment text
    match: DocumentReference.content.attachment.data
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact document reference attachment url
    match: DocumentReference.content.attachment.url
    action: redact

  - name: redact document reference attachment title
    match: DocumentReference.content.attachment.title
    action: redact

  - name: redact document reference attachment hash
    match: DocumentReference.content.attachment.hash
    action: redact

  # DiagnosticReport, QuestionnaireResponse  presentedForm is Attachment directly
  - name: scrub presented form text
    match: "*.presentedForm.data"
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact presented form url
    match: "*.presentedForm.url"
    action: redact

  - name: redact presented form title
    match: "*.presentedForm.title"
    action: redact

  # Observation, Task  valueAttachment
  - name: scrub value attachment text
    match: "*.valueAttachment.data"
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact value attachment url
    match: "*.valueAttachment.url"
    action: redact

  # Photos  biometric identifiers, never NLP-scrubable
  - name: redact photo data
    match: "*.photo.data"
    action: redact

  - name: scrub binary resource data
    match: Binary.data
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4
