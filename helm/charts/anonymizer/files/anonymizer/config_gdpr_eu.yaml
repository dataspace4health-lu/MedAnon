# =============================================================================
# EU GDPR Pseudonymization Profile for MedAnon
# =============================================================================
#
# Legal basis: GDPR (EU) 2016/679
#   - Art. 4(1)   Personal data definition (name, ID, location, online ID,
#                  physical/physiological/genetic/economic/cultural identifiers)
#   - Art. 4(5)   Pseudonymisation (replacing identifiers with a pseudonym)
#   - Art. 5(1)   Data minimisation & storage limitation
#   - Art. 25     Data protection by design and by default
#   - Art. 32     Security of processing (cryptographic measures)
#   - Art. 89     Safeguards for health / research data processing
#
# Strategy used:
#   cryptohash  → SHA3-256 HMAC (reversible with key; satisfies Art. 4(5))
#   redact      → permanent deletion (satisfies Art. 17 right to erasure,
#                 and Art. 5(1)(e) storage limitation)
#
# Key management (GDPR Art. 32):
#   Do NOT set secret_key here in production. Instead set the environment
#   variable MEDANON_HASH_KEY. The inline secret_key below is for local
#   development / testing ONLY.
#
# Covered resource types:
#   Patient, Practitioner, PractitionerRole, RelatedPerson, Organization,
#   Person, Group (with wildcards for common cross-resource identifiers)
#
# Implementation note  HumanName / Identifier complex types:
#   cryptohash targets scalar leaf fields only.  Applying cryptohash to the
#   parent complex object (e.g. Patient.name, Patient.identifier) replaces
#   the entire struct with a hex string, breaking FHIR R4 schema validity.
#   Identifiers are pseudonymized at the .value leaf; all other Identifier
#   sub-fields (.system, .type, .use) are preserved for structural fidelity.
# =============================================================================

general:
  appname: MedAnon
  hash_type: sha3_256

# To enable HMAC keyed pseudonymization add:
#   params: &hmac_params
#     hash_type: sha3_256
#     secret_key_env: MEDANON_HASH_KEY   # read key from env (recommended)
# Then reference with:  params: *hmac_params

rules:

  # ---------------------------------------------------------------------------
  # PATIENT  (most common PHI carrier in FHIR)
  # ---------------------------------------------------------------------------

  # Direct identifier: legal name(s)  target HumanName leaf scalars only
  # (hashing the parent HumanName object would replace it with a hex string,
  #  breaking FHIR R4 schema)
  - name: patient name family
    match: Patient.name.family
    action: cryptohash

  - name: patient name given
    match: Patient.name.given
    action: cryptohash

  - name: patient name text
    match: Patient.name.text
    action: cryptohash

  # Contact names (guarantors, next-of-kin)
  - name: patient contact name family
    match: Patient.contact.name.family
    action: cryptohash

  - name: patient contact name given
    match: Patient.contact.name.given
    action: cryptohash

  - name: patient contact name text
    match: Patient.contact.name.text
    action: cryptohash

  # Administrative identifiers: MRN, SSN, health card, insurance number, etc.
  # Target .value only  preserves .system, .type, .use for structural fidelity
  - name: patient identifier value
    match: Patient.identifier.value
    action: cryptohash

  # Date of birth  high re-identification risk (quasi-identifier)
  - match: Patient.birthDate
    action: redact

  # Deceased date/boolean  retained as boolean structure, exact date redacted
  - match: Patient.deceasedDateTime
    action: redact

  # Contact details: phone, mobile, fax, email, URL
  - match: Patient.telecom
    action: redact

  - match: Patient.contact.telecom
    action: redact

  # Full postal address (street, city, district, postal code)
  - match: Patient.address
    action: redact

  # Geolocation (lat/lon) nested inside Patient.address.extension  re-identification PHI
  - name: redact patient address geolocation
    match: Patient.address.extension
    action: redact

  - match: Patient.contact.address
    action: redact

  # Photo / biometric data (Art. 9 special category)
  - match: Patient.photo
    action: redact

  # Patient links to other Patient records (re-identification via merge chains)
  - match: Patient.link
    action: redact

  # Quasi-identifiers  GDPR Art. 4(1): marital status and language are personal
  # data that enable re-identification when combined with other attributes.
  - match: Patient.maritalStatus
    action: redact

  - match: Patient.communication
    action: redact

  # ---------------------------------------------------------------------------
  # PRACTITIONER  (indirect identifier when combined with clinical data)
  # ---------------------------------------------------------------------------

  - name: practitioner name family
    match: Practitioner.name.family
    action: cryptohash

  - name: practitioner name given
    match: Practitioner.name.given
    action: cryptohash

  - name: practitioner name text
    match: Practitioner.name.text
    action: cryptohash

  - name: practitioner identifier value
    match: Practitioner.identifier.value
    action: cryptohash

  - match: Practitioner.birthDate
    action: redact

  - match: Practitioner.telecom
    action: redact

  - match: Practitioner.address
    action: redact

  - match: Practitioner.photo
    action: redact

  # ---------------------------------------------------------------------------
  # RELATED PERSON  (family member / designee data)
  # ---------------------------------------------------------------------------

  - name: relatedperson name family
    match: RelatedPerson.name.family
    action: cryptohash

  - name: relatedperson name given
    match: RelatedPerson.name.given
    action: cryptohash

  - name: relatedperson name text
    match: RelatedPerson.name.text
    action: cryptohash

  - name: relatedperson identifier value
    match: RelatedPerson.identifier.value
    action: cryptohash

  - match: RelatedPerson.birthDate
    action: redact

  - match: RelatedPerson.telecom
    action: redact

  - match: RelatedPerson.address
    action: redact

  - match: RelatedPerson.photo
    action: redact

  # ---------------------------------------------------------------------------
  # ORGANIZATION  (named entity that may identify a patient indirectly by
  #                association, e.g. specialist clinic)
  # Organization.name is a plain string in FHIR R4  cryptohash applies
  # directly without breaking schema.
  # ---------------------------------------------------------------------------

  - name: organization name
    match: Organization.name
    action: cryptohash

  - name: organization identifier value
    match: Organization.identifier.value
    action: cryptohash

  - match: Organization.telecom
    action: redact

  - match: Organization.address
    action: redact

  # ---------------------------------------------------------------------------
  # PERSON  (base demographic record)
  # ---------------------------------------------------------------------------

  - name: person name family
    match: Person.name.family
    action: cryptohash

  - name: person name given
    match: Person.name.given
    action: cryptohash

  - name: person name text
    match: Person.name.text
    action: cryptohash

  - name: person identifier value
    match: Person.identifier.value
    action: cryptohash

  - match: Person.birthDate
    action: redact

  - match: Person.telecom
    action: redact

  - match: Person.address
    action: redact

  - match: Person.photo
    action: redact

  # ---------------------------------------------------------------------------
  # CROSS-RESOURCE WILDCARDS
  # Applied to any resource type not explicitly listed above.
  # ---------------------------------------------------------------------------

  # Pseudonymize all resource-level logical IDs (prevents patient linkage
  # across datasets through stable resource IDs).
  - match: "*.id"
    action: cryptohash

  # Subject/patient reference strings link clinical resources back to the patient
  #  must be redacted to break re-identification via reference strings.
  - match: "*.subject.reference"
    action: redact

  - match: "*.patient.reference"
    action: redact

  - match: "*.subject.display"
    action: redact

  - match: "*.display"
    action: nlp_detect_act
    params:
      entities: healthcare

  # Actor references (performer, recorder, etc.) identify treating clinicians
  - match: "*.performer.reference"
    action: redact

  - match: "*.recorder.reference"
    action: redact

  # ---------------------------------------------------------------------------
  # SDOH / PRAPARE QUASI-IDENTIFIERS
  # PRAPARE (LOINC panel 93025-5) components carry social-determinant data
  # that qualify as personal data under GDPR Art. 4(1): income, household
  # size, education, language, and employment status combined enable
  # re-identification. Street address (LOINC 56799-0) is caught by the
  # scrub_text street_address rule below; numeric and coded components require
  # explicit targeting.
  # ---------------------------------------------------------------------------

  - name: redact PRAPARE annual income
    match: "Observation.component.where(code.coding.where(code='63586-2').exists())"
    action: redact

  - name: redact PRAPARE household size
    match: "Observation.component.where(code.coding.where(code='63512-8').exists())"
    action: redact

  - name: redact PRAPARE education level
    match: "Observation.component.where(code.coding.where(code='82589-3').exists())"
    action: redact

  - name: redact PRAPARE preferred language
    match: "Observation.component.where(code.coding.where(code='54899-0').exists())"
    action: redact

  - name: redact PRAPARE employment status
    match: "Observation.component.where(code.coding.where(code='67875-5').exists())"
    action: redact

  # ---------------------------------------------------------------------------
  # TEXT SCRUBBING (narrative and CodeableConcept fields)
  # Dual-pass: regex catches structured PHI (dates, phones, SSN);
  # NLP catches unstructured names and locations.
  # ---------------------------------------------------------------------------

  # FHIR Narrative (XHTML)  safe-harbor tokenization preserving structure
  - match: "*.text"
    action: scrub_text
    params:
      mode: html_tokenize
      patterns: all

  - match: "*.text"
    action: nlp_scrub
    params:
      mode: tokenize
      html: true
      threshold: 0.4

  # Clinical notes  plain text
  - match: "*.note.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  # Nested CodeableConcept text fields  NLP only (preserves clinical terms,
  # catches embedded patient names/IDs inserted by EHR systems)
  - match: "*.code.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  - match: "*.substance.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  - match: "*.valueCodeableConcept.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  - match: "*.medicationCodeableConcept.text"
    action: nlp_scrub
    params:
      mode: tokenize
      threshold: 0.4

  # Street address pattern  fires on any valueString containing a recognizable
  # address regardless of LOINC code or resource structure (covers PRAPARE 56799-0,
  # custom SDOH panels, and any other free-text fields with address content).
  # Two rules: one for top-level valueString, one for component.valueString
  # (e.g. Observation.component in PRAPARE / SDOH panels).
  - name: scrub street addresses in valueString
    match: "*.valueString"
    action: scrub_text
    params:
      mode: text
      patterns: street_address

  - name: scrub street addresses in component valueString
    match: "*.component.valueString"
    action: scrub_text
    params:
      mode: text
      patterns: street_address

  - match: "*.valueString"
    action: nlp_detect_act
    params:
      threshold: 0.4

  # Identifier type labels disclose PHI categories even when values are pseudonymized
  - name: redact identifier type text labels
    match: "*.identifier.type.text"
    action: redact

  - name: redact identifier type coding display labels
    match: "*.identifier.type.coding.display"
    action: redact

  # Dosage and reaction free-text
  - match: "*.dosage.text"
    action: nlp_detect_act
    params:
      threshold: 0.4

  - match: "*.dosage.patientInstruction"
    action: nlp_detect_act
    params:
      threshold: 0.4

  - match: "*.reaction.description"
    action: nlp_detect_act
    params:
      threshold: 0.4

  - match: "*.comment"
    action: nlp_detect_act
    params:
      threshold: 0.4

  # ===========================================================================
  # DOCUMENTS / ATTACHMENTS (GDPR Art. 4(1)  personal data in any format)
  # text/* payloads: Base64-decoded → NLP-scrubbed → re-encoded.
  # Non-text MIME types (image/*, application/pdf …): data field redacted.
  # Attachment URL/title/hash always redacted.
  # NOTE: *.attachment.data does NOT match DocumentReference  the attachment is
  # nested under content[*].attachment, so specific paths are required per resource.
  # ===========================================================================

  # DocumentReference  clinical notes (content[*].attachment, nested one level)
  - name: scrub document reference attachment text
    match: DocumentReference.content.attachment.data
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact document reference attachment url
    match: DocumentReference.content.attachment.url
    action: redact

  - name: redact document reference attachment title
    match: DocumentReference.content.attachment.title
    action: redact

  - name: redact document reference attachment hash
    match: DocumentReference.content.attachment.hash
    action: redact

  # DiagnosticReport, QuestionnaireResponse  presentedForm is Attachment directly
  - name: scrub presented form text
    match: "*.presentedForm.data"
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact presented form url
    match: "*.presentedForm.url"
    action: redact

  - name: redact presented form title
    match: "*.presentedForm.title"
    action: redact

  # Observation, Task  valueAttachment
  - name: scrub value attachment text
    match: "*.valueAttachment.data"
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4

  - name: redact value attachment url
    match: "*.valueAttachment.url"
    action: redact

  # Photos  biometric identifiers, never NLP-scrubable
  - name: redact photo data
    match: "*.photo.data"
    action: redact

  - name: scrub binary resource data
    match: Binary.data
    action: nlp_detect_act
    params:
      base64_encoded: true
      entities: healthcare
      threshold: 0.4
