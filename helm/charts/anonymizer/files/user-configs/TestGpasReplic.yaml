# =============================================================================
# MedAnon User Config: TestGpasReplic
# Production pseudonymization via gPAS with dual-pass NLP scrubbing.
# =============================================================================

general:
  appname: SPE-FHIR-BlackBox
rules:
- match: '*.id'
  action: gpas_pseudonymize
- match: Patient.name
  action: redact
- match: Patient.telecom
  action: redact
- match: Patient.address
  action: redact
- match: Patient.photo
  action: redact
- match: Patient.identifier.value
  action: gpas_pseudonymize
- match: Patient.gender
  action: redact
- match: Patient.maritalStatus
  action: redact
- match: Patient.communication
  action: redact
- match: Patient.birthDate
  action: generalize
- match: '*.effectiveDateTime'
  action: generalize
- match: '*.issued'
  action: generalize
- match: '*.authoredOn'
  action: generalize
- match: '*.recordedDate'
  action: generalize
- match: '*.meta.lastUpdated'
  action: redact
- match: '*.meta.versionId'
  action: redact
- match: Practitioner.name
  action: redact
- match: Practitioner.telecom
  action: redact
- match: Practitioner.address
  action: redact
- match: Practitioner.photo
  action: redact
- match: Practitioner.identifier.value
  action: gpas_pseudonymize
- match: Practitioner.gender
  action: redact
- match: Practitioner.birthDate
  action: redact
- match: Practitioner.qualification
  action: redact
- match: PractitionerRole.code
  action: redact
- match: PractitionerRole.organization
  action: redact
- match: Organization.name
  action: redact
- match: Organization.telecom
  action: redact
- match: Organization.address
  action: redact
- match: Organization.identifier.value
  action: gpas_pseudonymize
- match: Location.name
  action: redact
- match: Location.address
  action: redact
- match: '*.performer'
  action: redact
- match: '*.author'
  action: redact
- match: '*.requester'
  action: redact
- match: '*.recorder'
  action: redact
- match: '*.participant.individual'
  action: redact
- match: CareTeam.participant.individual
  action: redact
- match: Encounter.participant.individual
  action: redact
- match: '*.subject.reference'
  action: gpas_pseudonymize
- match: '*.patient.reference'
  action: gpas_pseudonymize
- match: '*.attachment'
  action: redact
- match: DocumentReference.content
  action: redact
- match: Binary.data
  action: redact
- match: '*.text'
  action: scrub_text
- match: '*.text'
  action: nlp_detect
- match: '*.note.text'
  action: scrub_text
- match: '*.note.text'
  action: nlp_detect
- match: '*.code.text'
  action: nlp_detect
- match: '*.substance.text'
  action: nlp_detect
- match: '*.valueCodeableConcept.text'
  action: nlp_detect
- match: '*.medicationCodeableConcept.text'
  action: nlp_detect
- match: '*.dosage.text'
  action: scrub_text
- match: '*.dosage.patientInstruction'
  action: scrub_text
- match: '*.reaction.description'
  action: scrub_text
- match: '*.comment'
  action: scrub_text
- match: Communication.sender
  action: redact
- match: Communication.recipient
  action: redact
- match: Communication.payload.contentString
  action: scrub_text
- match: Task.requester
  action: redact
- match: Task.owner
  action: redact
- match: ServiceRequest.requester
  action: redact
- match: Device.identifier.value
  action: gpas_pseudonymize
- match: Provenance.agent
  action: redact
- match: AuditEvent.agent
  action: redact
- match: AuditEvent.source
  action: redact
- match: '*.identifier.value'
  action: gpas_pseudonymize
- match: '*.name'
  action: redact
- match: '*.telecom'
  action: redact
- match: '*.address'
  action: redact
