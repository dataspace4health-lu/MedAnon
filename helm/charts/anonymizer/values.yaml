# ─────────────────────────────────────────────────────────────────────────────
# MedAnon Anonymizer Helm Chart  default values
#
# Customise with --set / -f my-values.yaml.
# When deployed via the fhir-diet umbrella chart, prefix keys with "anonymizer."
# ─────────────────────────────────────────────────────────────────────────────

# Helm global values  automatically populated by a parent (umbrella) chart.
# These defaults are only active when the chart is installed standalone.
global:
  registry: ""
  imagePullPolicy: ""
  imagePullSecrets: []

# Container registry prefix  prepended to the image name.
# Leave empty to pull by image name directly.
# Sub-chart: overridden by global.registry from the parent if set.
registry: ""

# Default pull policy. Sub-chart: overridden by global.imagePullPolicy if set.
imagePullPolicy: IfNotPresent

# Optional image pull secrets (e.g. for private registries).
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

image: medanon
# Pinned to chart appVersion. Override at install time with `--set tag=<version>`
# to deploy a different release. Never use "latest" in production.
tag: "2025.2.0"
replicas: 1
port: 8000

# Which config profile to mount as the active config.
# Options: config.yaml | config_gpas.yaml | config_gdpr_eu.yaml
# Customise the files under files/anonymizer/ to change rules.
configProfile: config_gpas.yaml

# ─── gPAS dependency ──────────────────────────────────────────────────────────
# When non-empty, an initContainer waits for gPAS TCP before the anonymizer
# starts  mirroring docker-compose depends_on: gpas: condition: service_started.
# Set to the gPAS Kubernetes Service name, e.g. "<release>-gpas".
# Leave empty when deploying standalone against an external gPAS (no wait).
gpasServiceName: ""
gpasPort: 8080

# ─── Environment  non-secret config ─────────────────────────────────────────
env:
  # gPAS TTP-FHIR gateway URL  required when using config_gpas.yaml.
  # Use the in-cluster Service name, e.g.: http://<release>-gpas:8080/ttp-fhir/fhir/gpas
  GPAS_URL: ""
  GPAS_DOMAIN: "TESTING"
  GPAS_OPERATION: "pseudonymizeAllowCreate"
  GPAS_TIMEOUT_SEC: "30"
  GPAS_CACHE_ENABLED: "true"
  GPAS_RETRY_COUNT: "2"
  GPAS_RETRY_BACKOFF_SEC: "0.2"

  # Comma-separated allowed origins for CORS
  MEDANON_CORS_ORIGINS: ""
  MEDANON_MAX_BODY_BYTES: "10485760"

  # Source FHIR server (for /fetch endpoint).
  # Use the in-cluster Service name, e.g.: http://<release>-fhir-server:8080/fhir
  FHIR_SOURCE_URL: ""
  FHIR_SOURCE_TOKEN: ""
  # Target FHIR server (for round-trip de-identification)
  FHIR_TARGET_URL: ""
  FHIR_TARGET_TOKEN: ""

  # Maximum concurrent job workers per anonymizer replica (default 3).
  # When Redis is enabled, each replica runs this many workers picking jobs
  # from the shared BLPOP queue. Raise for compute-heavy deployments.
  MEDANON_JOB_WORKERS: "3"

  # Include transformation manifest in meta.tag (default off  opt-in).
  # Set to "true" to embed a per-resource transformation log for audit/UI use.
  MEDANON_MANIFEST_ENABLED: "false"

# ─── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  # HMAC-SHA3-256 key for the cryptohash action.
  # Without this, hashes are plain SHA3-256 (not production-safe).
  MEDANON_HASH_KEY: ""

  # gPAS credentials (only needed if gPAS FHIR API has auth enabled).
  # REQUIRED for non-local deployments  set via --set or a sealed secret.
  # Must match the password seeded in services/gpas/sqls/02_init_database_gras_for_gpas.sql.
  GPAS_BASIC_USER: ""
  GPAS_BASIC_PASS: ""
  GPAS_TOKEN: ""

  # RSA keypair for encrypt/decrypt actions.
  # Set to PEM content (not file path). Mounted at /code/app/keys/.
  rsaPublicKey: ""
  rsaPrivateKey: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ─── Observability (Prometheus Operator) ───────────────────────────────────
# Render ServiceMonitor + PrometheusRule CRDs (kube-prometheus-stack).
# Leave disabled if the Prometheus Operator CRDs are NOT installed in the
# cluster, otherwise `helm install` will fail with "no matches for kind".
monitoring:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Extra labels (e.g. release: prometheus) so the operator picks the SM up.
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Override alert thresholds without touching the template.
    thresholds:
      errorRate: "0.05"            # 5xx fraction triggering warning
      p95LatencySeconds: "2"        # request p95 ceiling
      gpasCacheHitRate: "0.5"       # below this triggers info alert

# ─── Redis sidecar (opt-in  shared cache + job queue) ────────────────────────
# When enabled, a Redis sidecar is added to the anonymizer Pod and
# MEDANON_REDIS_URL is injected pointing to localhost:6379. This activates:
#   1. L2 gPAS pseudonym cache shared across all replicas.
#   2. Scalable job queue (BLPOP event-driven worker replaces SQLite polling).
#
# The Redis sidecar is NOT a persistent store  data loss on Pod restart is expected.
# For production HA deployments consider a standalone Redis cluster instead.
redis:
  enabled: false
  image: redis:7-alpine
  ttlSeconds: 3600
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ─── Shared output PVC (job results) ─────────────────────────────────────────
# Name of an existing PVC to mount at /output (shared with worker pod).
# Both anonymizer and worker must reference the same PVC so results written
# by the worker are readable by the API. Leave empty to use emptyDir (not
# suitable for multi-pod deployments  worker results won't be visible to API).
sharedOutputPVC: ""

# Network policy configuration
networkPolicy:
  # Additional namespaces allowed to send ingress traffic (e.g. ingress controller namespace)
  additionalIngressNamespaces: []
