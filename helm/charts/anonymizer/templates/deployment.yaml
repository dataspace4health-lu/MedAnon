{{- $registry := coalesce .Values.registry .Values.global.registry "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anonymizer.fullname" . }}
  labels:
    {{- include "anonymizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: anonymizer
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anonymizer.selectorLabels" (dict "Release" .Release "component" "anonymizer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anonymizer.selectorLabels" (dict "Release" .Release "component" "anonymizer") | nindent 8 }}
        {{- include "anonymizer.labels" . | nindent 8 }}
        app.kubernetes.io/component: anonymizer
      annotations:
        # Force pod restart when config or secret changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.port }}"
        prometheus.io/path: "/metrics"
        {{- with .Values.global.mtls }}
        {{- if and .enabled (eq .provider "linkerd") }}
        linkerd.io/inject: "enabled"
        {{- end }}
        {{- if and .enabled (eq .provider "istio") }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "anonymizer.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gpasServiceName }}
      # Wait for gPAS to be accepting TCP connections before the anonymizer starts.
      # Mirrors docker-compose depends_on: gpas: condition: service_started.
      initContainers:
        - name: wait-for-gpas
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for gPAS at {{ .Values.gpasServiceName }}:{{ .Values.gpasPort }} ..."
              until nc -z {{ .Values.gpasServiceName }} {{ .Values.gpasPort }}; do
                sleep 2
              done
              echo "gPAS is reachable."
      {{- end }}
      containers:
        - name: anonymizer
          image: {{ include "anonymizer.image" (dict "registry" $registry "image" .Values.image "tag" .Values.tag) }}
          imagePullPolicy: {{ coalesce .Values.imagePullPolicy .Values.global.imagePullPolicy "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          # ── Environment — non-secret config ──────────────────────────────────
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # RSA key file paths (absolute — WORKDIR is /code/src, keys are at /code/keys)
            - name: MEDANON_RSA_PUBLIC_KEY
              value: "/code/keys/id_rsa.pub"
            - name: MEDANON_RSA_PRIVATE_KEY
              value: "/code/keys/id_rsa"
          # ── Environment — secrets ─────────────────────────────────────────────
          envFrom:
            - secretRef:
                name: {{ include "anonymizer.fullname" . }}-secret
          # ── Volume mounts ─────────────────────────────────────────────────────
          volumeMounts:
            # Config profiles mounted at /code/config — override the image-baked copies
            - name: config
              mountPath: /code/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_gpas.yaml
              subPath: config_gpas.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_gdpr_eu.yaml
              subPath: config_gdpr_eu.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_hipaa_safe_harbor.yaml
              subPath: config_hipaa_safe_harbor.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_research_pseudonymous.yaml
              subPath: config_research_pseudonymous.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_structure_preserving.yaml
              subPath: config_structure_preserving.yaml
              readOnly: true
            - name: config
              mountPath: /code/config/config_value_masking.yaml
              subPath: config_value_masking.yaml
              readOnly: true
            # Imported user-defined configs (read-only ConfigMap)
            - name: user-configs
              mountPath: /output/user-configs
              readOnly: true
            {{- if and .Values.secrets.rsaPublicKey .Values.secrets.rsaPrivateKey }}
            # RSA keys mounted at /code/keys/
            - name: rsa-keys
              mountPath: /code/keys
              readOnly: true
            {{- end }}
            # Writable /output for job results (shared PVC with worker)
            - name: output
              mountPath: /output
            # Writable /tmp required by Python and spaCy (readOnlyRootFilesystem=true)
            - name: tmp
              mountPath: /tmp
          # ── Health checks ─────────────────────────────────────────────────────
          # startupProbe gives slow dependencies (gPAS WildFly cold-start ~90 s,
          # HAPI initial schema migration) up to 5 minutes to come online before
          # liveness kicks in.  Without it, an aggressive livenessProbe would
          # restart-loop the pod during normal cluster boot.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anonymizer.fullname" . }}-config
        - name: user-configs
          configMap:
            name: {{ include "anonymizer.fullname" . }}-user-configs
            optional: true
        {{- if and .Values.secrets.rsaPublicKey .Values.secrets.rsaPrivateKey }}
        - name: rsa-keys
          secret:
            secretName: {{ include "anonymizer.fullname" . }}-secret
            items:
              - key: id_rsa.pub
                path: id_rsa.pub
              - key: id_rsa
                path: id_rsa
                mode: 0600
        {{- end }}
        - name: output
          {{- if .Values.sharedOutputPVC }}
          persistentVolumeClaim:
            claimName: {{ .Values.sharedOutputPVC }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
