{{- /*
  ConfigMap of imported user-defined configs.
  Files under helm/charts/anonymizer/files/user-configs/*.yaml are mounted
  read-only at /output/user-configs/ in both anonymizer and worker pods so
  that the API (which reads YAML from MEDANON_USER_CONFIG_DIR) can serve them
  alongside the system bundled profiles.

  Note: profiles uploaded later via the API are NOT durable in this chart 
  they must be added to files/user-configs/ and re-released. For full
  persistence, replace this ConfigMap with a PVC.
*/ -}}
{{- $files := .Files.Glob "files/user-configs/*.yaml" -}}
{{- if $files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anonymizer.fullname" . }}-user-configs
  labels:
    {{- include "anonymizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: anonymizer
data:
{{- range $path, $_ := $files }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
