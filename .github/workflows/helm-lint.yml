name: Helm Lint
on:
  push:
    paths: ["helm/**"]
  pull_request:
    paths: ["helm/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./helm/medanon
      - name: Helm template (dry-run)
        run: helm template medanon ./helm/medanon
