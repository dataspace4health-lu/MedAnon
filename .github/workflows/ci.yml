name: CI
on:
  push:
    branches: [main, Staging]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check services/anonymizer/src

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/anonymizer/requirements.txt
      - name: Install dependencies
        run: |
          pip install -e packages/medanon-core
          pip install -r services/anonymizer/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run local tests (no Docker required)
        working-directory: services/anonymizer
        env:
          MEDANON_HASH_ALLOW_PLAIN: "true"
          MEDANON_CONFIG_DIR: config
          MEDANON_RATE_LIMIT_ENABLED: "false"
        run: |
          python -m pytest \
            tests/test_io_formats.py \
            tests/test_synthetic.py \
            tests/test_synthetic_sdv.py \
            tests/test_config_profiles.py \
            tests/test_api.py \
            tests/test_auth.py \
            tests/test_risk.py \
            tests/test_fhir_client.py \
            tests/test_cli.py \
            tests/test_cli_integration.py \
            -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build anonymizer image
        run: docker build -t medanon:ci services/anonymizer --target prod
      - name: Build UI image
        run: docker build -t medanon-ui:ci client
