name: CI

on:
  push:
    branches: [main, Staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Static analysis (all run in parallel) ─────────────────────────

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: `pip install ruff` resolved to whatever was current that day, so
      # `ruff format --check` compared today's formatter against a tree formatted
      # by an older one. Settings now live in the root ruff.toml.
      - run: pip install -r requirements-dev.txt
      # The shared inner package (domain, analytics, scoring) - editable install
      # so ruff, import-linter and the suites resolve it as top-level packages.
      - run: pip install -e packages/medanon-core
      - name: ruff check
        run: ruff check services/anonymizer/src packages/medanon-core/src
      # Architecture guardrail: two layering contracts, both enforced at zero
      # (no ignore_imports) - the anonymizer, and the shared package's own leaves.
      - name: import-linter (anonymizer)
        run: cd services/anonymizer && PYTHONPATH=src lint-imports
      - name: import-linter (medanon-core)
        run: cd packages/medanon-core && PYTHONPATH=src lint-imports
      - name: ruff format --check
        run: ruff format --check services/ packages/
      # medanon-core unit tests (packages/medanon-core/tests) are gitignored like
      # the service suites, so they run in the pre-push `make ci-local`, not here.
      - name: NLP entity catalogue in sync
        run: bash scripts/sync_shared_code.sh
      - name: Env drift (.env.example vs code + compose)
        run: python3 scripts/check_env.py
      - name: Env catalogue is up to date
        run: |
          python3 scripts/check_env.py --docs docs/reference/env-vars.md
          git diff --exit-code -- docs/reference/env-vars.md

  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint .

  sast-python:
    name: SAST – Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit security scan
        run: bandit -r services/anonymizer/src -ll -ii

  sast-typescript:
    name: SAST – ESLint Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm install --save-dev eslint-plugin-security
      - name: ESLint with security plugin
        run: |
          npx eslint --plugin security \
            --rule "security/detect-object-injection: warn" \
            --rule "security/detect-non-literal-fs-filename: warn" \
            --rule "security/detect-eval-with-expression: error" \
            "src/**/*.{ts,tsx}" || true

  dep-scan-python:
    name: Dependency Scan – pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r services/anonymizer/requirements.txt

  dep-scan-node:
    name: Dependency Scan – npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scan – gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan past commits
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any leaked secret. Tune via .gitleaks.toml if needed.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ── Stage 2: Build + Test (depends on lint passing) ────────────────────────

  # `**/tests/` is gitignored: the suite is deliberately not published. This job
  # therefore SKIPS on the public repository and runs only where the tests are
  # present (a fork or clone that carries them). The gate that actually protects
  # `main` is `make ci-local`, run before pushing -- see CONTRIBUTING / Makefile.
  #
  # It previously did `pip install -e packages/medanon-core` (no such package has
  # ever existed in this repo) and named ten test files by hand, so it could not
  # have passed even where the tests were present. It now runs the whole suite.
  test:
    name: Unit Tests (skipped when tests/ is absent)
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - name: Detect test suite
        id: detect
        run: |
          if [ -n "$(find services/anonymizer/tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/anonymizer/tests/ is gitignored; skipping. Run 'make ci-local' before pushing."
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/anonymizer/requirements.txt
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          pip install -r services/anonymizer/requirements.txt
          pip install -e packages/medanon-core
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run the full suite (no Docker required)
        if: steps.detect.outputs.present == 'true'
        working-directory: services/anonymizer
        env:
          MEDANON_HASH_ALLOW_PLAIN: "true"
          MEDANON_CONFIG_DIR: config
          MEDANON_RATE_LIMIT_ENABLED: "false"
          MEDANON_MANIFEST_ENABLED: "true"
        run: python -m pytest tests/ -q --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-python, lint-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Build anonymizer image
        run: docker build -t medanon:ci -f services/anonymizer/Dockerfile --target prod .
      - name: Build UI image
        run: docker build -t medanon-ui:ci client/
      - name: Save images for downstream jobs
        run: |
          docker save medanon:ci -o /tmp/medanon-ci.tar
          docker save medanon-ui:ci -o /tmp/medanon-ui-ci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/medanon-*.tar
          retention-days: 1

  # ── Stage 3: Container scanning (depends on docker-build) ──────────────────

  trivy-fs:
    name: Trivy – filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Code Scanning
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (SARIF)
        run: |
          trivy fs --config trivy.yaml \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy-fs.sarif \
            --exit-code 0 \
            .
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (fail on CRITICAL/HIGH)
        run: |
          trivy fs --config trivy.yaml \
            --scanners vuln,secret,misconfig \
            --exit-code 1 \
            .

  trivy-anonymizer:
    name: Trivy – anonymizer image
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/medanon-ci.tar
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Trivy image scan (SARIF)
        run: |
          trivy image --config trivy.yaml \
            --scanners vuln,secret \
            --format sarif \
            --output trivy-anonymizer.sarif \
            --exit-code 0 \
            medanon:ci
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-anonymizer.sarif
          category: trivy-anonymizer
      - name: Trivy image scan (fail on CRITICAL/HIGH)
        run: |
          trivy image --config trivy.yaml \
            --scanners vuln,secret \
            --exit-code 1 \
            medanon:ci

  trivy-ui:
    name: Trivy – UI image
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/medanon-ui-ci.tar
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Trivy image scan (SARIF)
        run: |
          trivy image --config trivy.yaml \
            --scanners vuln,secret \
            --format sarif \
            --output trivy-ui.sarif \
            --exit-code 0 \
            medanon-ui:ci
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-ui.sarif
          category: trivy-ui
      - name: Trivy image scan (fail on CRITICAL/HIGH)
        run: |
          trivy image --config trivy.yaml \
            --scanners vuln,secret \
            --exit-code 1 \
            medanon-ui:ci

  # ── Stage 4: Integration test (depends on docker-build) ────────────────────

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: |
          cp .env.example .env
          # Generate required passwords for CI (generate once, reuse where needed)
          REDIS_PW="ci-redis-$(date +%s)"
          echo "MEDANON_REDIS_PASSWORD=${REDIS_PW}" >> .env
          echo "MEDANON_REDIS_URL=redis://:${REDIS_PW}@redis:6379/0" >> .env
          echo "GPAS_DB_PASSWORD=ci-test-$(date +%s)" >> .env
          echo "HAPI_DB_PASSWORD=ci-test-$(date +%s)" >> .env
          echo "HAPI_TARGET_DB_PASSWORD=ci-test-$(date +%s)" >> .env
          # MinIO vars use :? in docker-compose so compose fails to parse the file
          # even when --profile s3 is not active. Provide placeholder values so
          # compose can parse the file; MinIO is not started (no --profile s3).
          echo "MINIO_ROOT_USER=ci-minio" >> .env
          echo "MINIO_ROOT_PASSWORD=ci-minio-$(date +%s)" >> .env
          # Cap CPU limits to 2 (GitHub Actions runners have 2 CPUs; Docker
          # rejects limits higher than the available CPU count)
          echo "ANONYMIZER_CPU_LIMIT=2.0" >> .env
          echo "WORKER_CPU_LIMIT=2.0" >> .env
          # gPAS env files are gitignored (third-party service config); create
          # empty stubs so docker compose can parse the file without error.
          mkdir -p services/gpas/envs
          for f in ttp_commons ttp_fhir ttp_gpas ttp_gras ttp_noti wf_commons; do
            touch services/gpas/envs/${f}.env
          done
      - name: Start full stack
        run: make up
        timeout-minutes: 10
      - name: Verify deployment
        run: make verify
        timeout-minutes: 5
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

  # ── Stage 5: Helm validation ───────────────────────────────────────────────

  helm:
    name: Helm Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./helm/medanon
      - name: Helm template
        run: helm template medanon ./helm/medanon > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Kubeconform validate
        run: kubeconform -strict -summary /tmp/rendered.yaml
