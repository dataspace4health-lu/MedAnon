name: CI

on:
  push:
    branches: [main, Staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Static analysis (all run in parallel) ─────────────────────────

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check services/anonymizer/src
      - name: ruff format --check
        run: ruff format --check services/anonymizer/src

  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint .

  sast-python:
    name: SAST – Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit security scan
        run: bandit -r services/anonymizer/src -ll -ii

  sast-typescript:
    name: SAST – ESLint Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm install --save-dev eslint-plugin-security
      - name: ESLint with security plugin
        run: npx eslint --plugin security --rule 'security/detect-object-injection: warn' --rule 'security/detect-non-literal-fs-filename: warn' --rule 'security/detect-eval-with-expression: error' 'src/**/*.{ts,tsx}' || true

  dep-scan-python:
    name: Dependency Scan – pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r services/anonymizer/requirements.txt

  dep-scan-node:
    name: Dependency Scan – npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  # ── Stage 2: Build + Test (depends on lint passing) ────────────────────────

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/anonymizer/requirements.txt
      - name: Install dependencies
        run: |
          pip install -e packages/medanon-core
          pip install -r services/anonymizer/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run local tests (no Docker required)
        working-directory: services/anonymizer
        env:
          MEDANON_HASH_ALLOW_PLAIN: "true"
          MEDANON_CONFIG_DIR: config
          MEDANON_RATE_LIMIT_ENABLED: "false"
        run: |
          python -m pytest \
            tests/test_api.py \
            tests/test_auth.py \
            tests/test_cache.py \
            tests/test_cli.py \
            tests/test_cli_integration.py \
            tests/test_config_profiles.py \
            tests/test_fhir_client.py \
            tests/test_integration.py \
            tests/test_io_formats.py \
            tests/test_jobs.py \
            tests/test_jobs_redis.py \
            tests/test_proxy_clients.py \
            tests/test_risk.py \
            tests/test_synthetic.py \
            -q --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-python, lint-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Build anonymizer image
        run: docker build -t medanon:ci -f services/anonymizer/Dockerfile --target prod .
      - name: Build UI image
        run: docker build -t medanon-ui:ci client/
      - name: Save images for downstream jobs
        run: |
          docker save medanon:ci -o /tmp/medanon-ci.tar
          docker save medanon-ui:ci -o /tmp/medanon-ui-ci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/medanon-*.tar
          retention-days: 1

  # ── Stage 3: Container scanning (depends on docker-build) ──────────────────

  trivy-anonymizer:
    name: Trivy – anonymizer image
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/medanon-ci.tar
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medanon:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  trivy-ui:
    name: Trivy – UI image
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/medanon-ui-ci.tar
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medanon-ui:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  # ── Stage 4: Integration test (depends on docker-build) ────────────────────

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: |
          cp .env.example .env
          # Generate required passwords for CI
          echo "GPAS_MYSQL_ROOT_PASSWORD=ci-test-$(date +%s)" >> .env
          echo "HAPI_DB_PASSWORD=ci-test-$(date +%s)" >> .env
          echo "HAPI_TARGET_DB_PASSWORD=ci-test-$(date +%s)" >> .env
      - name: Start full stack
        run: make up
        timeout-minutes: 10
      - name: Verify deployment
        run: make verify
        timeout-minutes: 5
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

  # ── Stage 5: Helm validation ───────────────────────────────────────────────

  helm:
    name: Helm Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./helm/medanon
      - name: Helm template
        run: helm template medanon ./helm/medanon > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Kubeconform validate
        run: kubeconform -strict -summary /tmp/rendered.yaml
