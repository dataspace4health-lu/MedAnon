global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: medanon

# Recording + alerting rules. The benchmark (docs/internal/BENCH_RESULTS_2026_07_20.md)
# showed the raw counters are there but the derived measures that actually matter
# (gPAS cold-call latency, cache hit ratio, per-stage time share) were never
# surfaced. These rules make them first-class and alert on the three bugs found.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: anonymizer
    static_configs:
      - targets: ['medanon:8000']
    metrics_path: /metrics

  - job_name: worker
    # Docker Compose internal DNS ('worker') resolves to all replica IPs.
    # dns_sd_configs re-resolves on every scrape interval so newly-scaled
    # replicas are picked up automatically without reloading Prometheus.
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9091
    metrics_path: /metrics

  - job_name: analytics
    static_configs:
      - targets: ['medanon-analytics:8100']
    metrics_path: /metrics

  # Scoring is on the hot path for every scored resource and was NOT being
  # scraped, so it was invisible in Grafana despite exposing /metrics.
  - job_name: scoring
    static_configs:
      - targets: ['medanon-scoring:8300']
    metrics_path: /metrics

  # Trust Gate only runs under the opt-in `trust` profile. When it is down the
  # target simply reports as down (which is itself useful: a dead Trust Gate is
  # the 8s-per-request stall the benchmark found). up{job="trust-gate"} == 0
  # drives the TrustGateDown alert below.
  - job_name: trust-gate
    static_configs:
      - targets: ['trust-gate:8400']
    metrics_path: /metrics

  - job_name: nlp
    static_configs:
      - targets: ['nlp:8200']
    metrics_path: /metrics

  - job_name: gateway
    static_configs:
      - targets: ['gateway:8082']
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
